rgos (Súmula 392 do STJ).", "Não pode trocar o devedor."], "txt": "<b>Presunção:<\/b> a dívida ativa regularmente inscrita goza de <b>presunção de certeza e liquidez<\/b> (art. 204 do CTN e art. 3º da LEF). Isso significa que o juiz presume que a dívida existe e que o valor está certo. Mas a presunção é <b>relativa<\/b>: pode ser derrubada por <b>prova inequívoca<\/b> a cargo do executado ou de terceiro a quem aproveite.\n<b>Vício:<\/b> a omissão de qualquer requisito, ou erro a ele relativo, é <b>causa de nulidade<\/b> da inscrição e do processo de cobrança (art. 203 do CTN).\n<b>Mas a nulidade pode ser sanada<\/b>. A Fazenda pode <b>emendar ou substituir<\/b> a CDA até a <b>decisão de primeira instância<\/b> (art. 2º, §8º da LEF). O devedor recebe <b>novo prazo para embargos<\/b>, restrito à parte modificada.\n<b>Súmula 392 do STJ:<\/b> a Fazenda pode substituir a CDA até a prolação da sentença de embargos, para corrigir <b>erro material ou formal<\/b>. <b>Não pode<\/b> alterar o <b>sujeito passivo<\/b> (trocar o devedor).\nTambém não vale para mudar o <b>fundamento do lançamento<\/b>: nesse caso é necessário um novo lançamento.\n<b>Exemplo:<\/b> a CDA saiu com um número de inscrição errado ou sem a indicação da lei: a Fazenda corrige. A CDA em nome de pessoa errada: não pode ser substituída para incluir outra pessoa; só novo redirecionamento, se houver base legal."}, {"id": "54", "t": "Quando o juiz recebe, manda emendar ou rejeita a execução fiscal", "q": ["Petição simples: juiz, pedido e citação, mais a CDA (art. 6º da LEF).", "Falha sanável: o juiz manda emendar (art. 801 do CPC).", "Rejeita: CDA nula sem correção, prescrição, falta de interesse, ilegitimidade."], "txt": "A <b>petição inicial<\/b> da execução fiscal é enxuta. Só precisa indicar (art. 6º da LEF): <b>o juiz<\/b> a quem se dirige, o <b>pedido<\/b> e o <b>requerimento de citação<\/b>. Vem instruída com a <b>CDA<\/b>, que faz parte da petição. O valor da causa é o da dívida.\n<b>O juiz pode:<\/b>\n<b>1) Receber (despacho positivo):<\/b> ordena a <b>citação<\/b>, a penhora, o arresto, o registro e a avaliação (art. 7º). Esse despacho <b>interrompe a prescrição<\/b> (art. 174 do CTN).\n<b>2) Mandar emendar:<\/b> se a petição ou a CDA tem falha <b>sanável<\/b>, o juiz dá prazo (15 dias) para corrigir, sob pena de indeferir (art. 801 do CPC; art. 2º, §8º da LEF).\n<b>3) Indeferir ou extinguir:<\/b> quando a CDA não tem <b>requisito essencial<\/b> e não é corrigida; quando falta <b>título<\/b>; quando reconhece <b>prescrição ou decadência<\/b>; quando há <b>ilegitimidade<\/b> ou <b>falta de interesse de agir<\/b> (como o valor irrisório, Tema 1184 do STF).\n<b>O que o juiz NÃO pode exigir:<\/b>\n• CPF/CNPJ do executado como condição (Súmula 558 do STJ);\n• planilha detalhada de cálculo (Súmula 559);\n• cópia do processo administrativo, em regra.\nAplica-se o <b>CPC<\/b> de forma subsidiária (art. 1º da LEF)."}, {"id": "55", "t": "Execução fiscal: passo a passo", "q": ["Petição com CDA, despacho, citação, 5 dias para pagar ou garantir.", "Penhora, embargos em 30 dias, impugnação em 30 dias.", "Sentença, leilão ou arquivamento."], "txt": "A <b>Lei 6.830/80<\/b> é a lei da <b>execução fiscal<\/b>: o processo pelo qual a Fazenda cobra a dívida ativa na Justiça.\n<b>Passos:<\/b>\n<b>1) Petição inicial e CDA<\/b> (já vimos).\n<b>2) Despacho do juiz<\/b> e <b>citação<\/b> (art. 8º): em regra pelo <b>correio<\/b>, com aviso de recebimento. Se o aviso não volta em 15 dias, citação por oficial de justiça ou por edital. O despacho que ordena a citação <b>interrompe a prescrição<\/b>.\n<b>3) Prazo de 5 dias:<\/b> o executado deve <b>pagar<\/b> a dívida ou <b>garantir a execução<\/b> (depósito, fiança bancária, seguro garantia, bens a penhora).\n<b>4) Penhora:<\/b> se não pagou nem garantiu, penhoram-se bens.\n<b>5) Embargos<\/b> em <b>30 dias<\/b> contados da garantia ou da intimação da penhora. A Fazenda impugna em 30 dias (art. 17).\n<b>6) Sentença<\/b> e eventual recurso.\n<b>7) Avaliação e leilão<\/b> dos bens (ou <b>adjudicação<\/b> pela Fazenda).\n<b>8) Extinção<\/b> pelo pagamento, ou suspensão se não achar bens (art. 40).\n<b>Competência:<\/b> varas especializadas, quando há; o foro é, em regra, do domicílio do executado.\n<b>Lembre:<\/b> a execução fiscal não depende de ação de conhecimento anterior. A CDA já é título."}, {"id": "56", "t": "Garantia e penhora na execução fiscal", "q": ["Garantias do art. 9º: dinheiro, fiança, seguro, bens.", "Ordem de penhora: dinheiro primeiro (art. 11).", "Substituição: executado por dinheiro ou fiança; Fazenda por outros bens (art. 15)."], "txt": "<b>Garantir a execução<\/b> é oferecer algo que cubra a dívida, para o devedor poder se defender sem perder bens de forma imediata. O art. 9º da LEF lista:\n<b>I)<\/b> <b>depósito em dinheiro<\/b> à ordem do juízo (cessam os juros e a correção para o devedor);\n<b>II)<\/b> <b>fiança bancária<\/b> ou <b>seguro garantia<\/b>;\n<b>III)<\/b> <b>nomeação de bens<\/b> à penhora, na ordem do art. 11;\n<b>IV)<\/b> bens de <b>terceiros<\/b> aceitos pela Fazenda.\nDepósito, fiança e seguro têm os mesmos efeitos da penhora.\n<b>Ordem legal de penhora (art. 11):<\/b> 1º dinheiro; 2º títulos da dívida pública e de bolsa; 3º pedras e metais preciosos; 4º imóveis; 5º navios e aeronaves; 6º veículos; 7º móveis e semoventes; 8º direitos e ações. O STJ admite a <b>penhora de dinheiro<\/b> (bloqueio on-line) sem exigir antes o esgotamento de outras diligências.\n<b>Substituição (art. 15):<\/b> em qualquer fase, o <b>executado<\/b> pode trocar a penhora por depósito em dinheiro ou fiança bancária; a <b>Fazenda<\/b> pode trocar os bens por outros, independentemente da ordem, e pedir reforço.\n<b>Atenção:<\/b> a Fazenda pode <b>recusar<\/b> a substituição por precatório (Súmula 406 do STJ). Bens <b>absolutamente impenhoráveis<\/b> (como o bem de família) ficam fora."}, {"id": "57", "t": "Embargos à execução fiscal", "q": ["Defesa do executado: 30 dias após a garantia (art. 16 da LEF).", "Exige garantia da execução (art. 16, §1º).", "Não admite reconvenção nem compensação."], "txt": "<b>Embargos à execução<\/b> é a <b>defesa principal<\/b> do devedor na execução fiscal. É uma ação própria, ligada à execução.\n<b>Prazo (art. 16):<\/b> <b>30 dias<\/b>, contados:\n• do <b>depósito<\/b> em dinheiro;\n• da <b>juntada da prova da fiança<\/b> ou do seguro garantia; ou\n• da <b>intimação da penhora<\/b>.\n<b>Exige garantia:<\/b> sem garantia do juízo, não se admitem embargos (art. 16, §1º). Se a penhora é insuficiente, o juiz pode dar prazo para reforço.\n<b>Conteúdo:<\/b> no prazo dos embargos o devedor deve alegar <b>toda a matéria de defesa<\/b> (pagamento, prescrição, decadência, nulidade da CDA, ilegitimidade, excesso), pedir provas e juntar documentos e rol de testemunhas (até 3, ou 6 a critério do juiz).\n<b>Não cabem<\/b> reconvenção nem compensação como defesa (§3º). As exceções de suspeição, incompetência e impedimento vêm como preliminar.\n<b>Efeito suspensivo:<\/b> <b>não é automático<\/b>. Pelo STJ (Tema 526) exige <b>garantia<\/b>, <b>relevância dos argumentos<\/b> (plausibilidade) e <b>risco de dano grave<\/b> de difícil reparação.\n<b>Trâmite:<\/b> a Fazenda tem 30 dias para impugnar (art. 17). Se a matéria for só de direito ou a prova só documental, o juiz sentencia sem audiência.\nO art. 38 da LEF permite discutir a dívida ativa por outras ações (MS, repetição, anulatória). A exigência de depósito prévio para anulatória foi afastada pela Súmula Vinculante 28."}, {"id": "58", "t": "Exceção de pré-executividade", "q": ["Defesa dentro da execução, sem garantia.", "Só matéria de ordem pública e sem necessidade de prova (Súmula 393 do STJ).", "Se precisa de prova, vá para os embargos."], "txt": "<b>Exceção de pré-executividade<\/b> (também chamada objeção) é uma <b>defesa simples<\/b>, apresentada <b>dentro do próprio processo de execução<\/b>, por simples petição, <b>sem garantir o juízo<\/b> e sem prazo fixo. Não está escrita na lei: nasceu da jurisprudência.\n<b>Quando cabe:<\/b> quando o problema pode ser visto <b>só pela leitura dos documentos<\/b> e o juiz poderia conhecê-lo de ofício. A <b>Súmula 393 do STJ<\/b> resume: é admissível na execução fiscal relativamente às <b>matérias conhecíveis de ofício que não demandem dilação probatória<\/b>.\n<b>Exemplos que costumam ser aceitos:<\/b>\n• prescrição e decadência evidentes;\n• ilegitimidade manifesta;\n• nulidade da CDA que salta aos olhos;\n• pagamento comprovado por documento já nos autos;\n• falta de condições da ação.\n<b>O que NÃO cabe:<\/b> discutir fatos que exigem perícia, testemunhas ou documentos novos. Para isso, o caminho são os <b>embargos<\/b>.\n<b>Sócio redirecionado:<\/b> se o nome do sócio <b>consta da CDA<\/b>, a prova de que não agiu com infração exige instrução, e então a via correta são os embargos (STJ).\n<b>Efeito:<\/b> se a exceção é <b>acolhida<\/b>, a execução é extinta e a Fazenda pode ser condenada em honorários. Se é <b>rejeitada<\/b>, a execução continua e não suspende o prazo para embargos."}, {"id": "59", "t": "Redirecionamento da execução aos sócios", "q": ["Responsabilidade do art. 135 do CTN, não pelo simples não pagamento.", "Dissolução irregular autoriza (Súmula 435 do STJ).", "Prescrição para redirecionar: 5 anos."], "txt": "<b>Redirecionamento<\/b> é incluir, no polo passivo da execução fiscal, uma pessoa que não aparece na CDA (em geral um sócio ou administrador), porque a empresa não paga e não há bens.\n<b>Base legal:<\/b> art. 135, III do CTN. O sócio só responde se for <b>gerente ou administrador<\/b> (com poderes) e tiver agido com <b>excesso de poderes ou infração de lei, contrato social ou estatuto<\/b>.\n<b>Pelo STJ:<\/b>\n• não basta a empresa <b>deixar de pagar<\/b> o tributo (Súmula 430);\n• a <b>dissolução irregular<\/b> da empresa (parou de funcionar no endereço sem avisar os órgãos) permite o redirecionamento (Súmula 435);\n• o pedido deve ser dirigido contra o sócio com poderes de administração <b>na data da dissolução irregular<\/b> e, também, contra o administrador <b>do tempo do fato gerador<\/b> que tenha agido com infração à lei;\n• se o <b>nome do sócio consta da CDA<\/b>, é ele quem deve provar que não houve infração; se não consta, o ônus é da Fazenda.\n<b>Incidente de desconsideração (IDPJ):<\/b> segundo o STJ, não é obrigatório quando o redirecionamento se funda nos arts. 134 e 135 do CTN; é necessário quando a Fazenda alega abuso da personalidade jurídica ou grupo econômico.\n<b>Prazo:<\/b> a prescrição para redirecionar é de <b>5 anos<\/b>, contados da citação da empresa (ou do ato posterior que justifique, pela teoria da <b>actio nata<\/b>)."}, {"id": "60", "t": "Prescrição intercorrente", "q": ["Ocorre depois do ajuizamento, quando o processo fica parado sem achar bens.", "Art. 40 da LEF: 1 ano de suspensão + 5 anos de prescrição.", "Súmula 314 do STJ."], "txt": "<b>Prescrição intercorrente<\/b> é aquela que acontece <b>durante o processo<\/b>, quando a execução fica parada por inércia da Fazenda. Uma execução fiscal não pode durar para sempre.\n<b>Regra (art. 40 da LEF):<\/b>\n<b>1)<\/b> Se o <b>devedor não é encontrado<\/b> ou <b>não há bens penhoráveis<\/b>, o juiz <b>suspende<\/b> a execução por <b>1 ano<\/b> (§§ 1º e 2º). Nesse período a prescrição não corre.\n<b>2)<\/b> Passado 1 ano sem solução, o juiz <b>arquiva<\/b> os autos.\n<b>3)<\/b> A partir daí começa a contar a <b>prescrição de 5 anos<\/b>. (<b>Súmula 314 do STJ:<\/b> suspende-se por um ano, findo o qual se inicia o prazo da prescrição quinquenal intercorrente.)\n<b>4)<\/b> Se achar bens ou o devedor, os autos são <b>desarquivados<\/b> (§3º).\n<b>5)<\/b> Se o prazo correu, o juiz, <b>ouvida a Fazenda<\/b>, pode reconhecer de ofício a prescrição (§4º).\n<b>Pelo STJ (Tema 566):<\/b>\n• o prazo de 1 ano começa <b>automaticamente<\/b> quando a Fazenda toma ciência de que não achou o devedor ou bens;\n• simples pedidos de diligências <b>sem resultado<\/b> não interrompem a prescrição;\n• só <b>citação efetiva<\/b> ou <b>penhora efetiva<\/b> interrompem.\n<b>Total:<\/b> 1 + 5 = 6 anos de inércia."}, {"id": "61", "t": "Execução de baixo valor, protesto da CDA e cobrança extrajudicial", "q": ["Tema 1184 do STF: é legítimo extinguir execução de baixo valor por falta de interesse de agir.", "Antes de ajuizar: tentar conciliação ou solução administrativa e protestar a CDA.", "Protesto de CDA é constitucional (ADI 5135)."], "txt": "Muitas execuções fiscais custam mais do que o valor cobrado. Para reduzir o excesso de processos, o STF decidiu no <b>Tema 1184<\/b> (RE 1.355.208, 2023):\n<b>1)<\/b> É <b>legítima<\/b> a extinção de execução fiscal de <b>baixo valor<\/b> pela <b>ausência de interesse de agir<\/b>, em respeito ao princípio da eficiência administrativa, respeitada a competência de cada ente federado.\n<b>2)<\/b> O ajuizamento depende de providências prévias: <b>tentativa de conciliação ou solução administrativa<\/b> e <b>protesto<\/b> do título, salvo se a Fazenda justificar que essas medidas seriam ineficazes.\n<b>3)<\/b> O trâmite de execuções já ajuizadas não impede a Fazenda de pedir <b>suspensão<\/b> para adotar essas medidas.\nQuem define o que é “baixo valor” é cada ente por <b>lei própria<\/b>. Na falta dela, a <b>Resolução CNJ 547/2024<\/b> usa o parâmetro de <b>R$ 10 mil<\/b> para a União, as autarquias e os conselhos (e inclui exigências de pesquisa de bens antes de ajuizar).\n<b>Protesto da CDA:<\/b> o STF reconheceu que é <b>constitucional<\/b> (ADI 5135, 2016), porque não restringe de modo desproporcional os direitos do contribuinte e <b>não é sanção política<\/b>. A Lei 9.492/97 foi alterada para admitir o protesto de CDA.\nO protesto serve como <b>cobrança extrajudicial<\/b> barata, e os cartórios o fazem."}, {"id": "62", "t": "Medida cautelar fiscal", "q": ["Lei 8.397/92: indisponibilidade de bens do devedor.", "Exige prova do crédito e de uma das hipóteses do art. 2º.", "Pode ser pedida antes ou durante a execução."], "txt": "<b>Medida cautelar fiscal<\/b> é uma ação com efeito <b>preventivo<\/b>: a Fazenda pede ao juiz que <b>bloqueie bens<\/b> do devedor, antes ou depois da execução, para impedir que ele se desfaça do patrimônio e frustre a cobrança. A lei é a <b>8.397/1992<\/b>.\n<b>Quando:<\/b> pode ser requerida após a <b>constituição do crédito<\/b> (inclusive durante a execução fiscal). Antes de constituído, só se o devedor tentar sumir ou alienar bens (art. 1º, parágrafo único).\n<b>Hipóteses (art. 2º)<\/b>, entre outras: o devedor sem domicílio certo tenta se ausentar ou vender bens; <b>caindo em insolvência<\/b>, vende bens; contrai dívidas que comprometem a liquidez; <b>notificado para pagar<\/b>, não paga (salvo garantia); tem débitos que somados passam de <b>30% do patrimônio<\/b> conhecido; vende bens sem comunicar o Fisco; tem o cadastro declarado inapto; pratica outros atos que dificultem a satisfação do crédito.\n<b>Requisitos (art. 3º):<\/b> <b>prova literal da constituição do crédito<\/b> fiscal e <b>prova documental<\/b> de alguma das hipóteses do art. 2º.\n<b>Efeito (art. 4º):<\/b> <b>indisponibilidade dos bens<\/b> até o limite da obrigação. Pode alcançar bens de <b>controladores e administradores<\/b> que tenham poderes para fazer a empresa cumprir suas obrigações.\n<b>Natureza:<\/b> o devedor pode <b>substituir<\/b> a medida por garantia, e a Fazenda precisa propor a execução no prazo legal."}]}, {"tema": "6. Impostos federais e contribuições", "itens": [{"id": "63", "t": "O que é imposto e quais são os impostos da União", "q": ["Imposto: tributo cobrado sem contraprestação específica (art. 16 do CTN).", "A União tem 8 impostos previstos (art. 153) mais residuais e de guerra.", "Extrafiscais: II, IE, IPI e IOF."], "txt": "<b>Imposto<\/b> é o tributo cujo fato gerador <b>não depende de nenhuma atividade específica do Estado em favor do contribuinte<\/b> (art. 16 do CTN). Você paga IR não porque o Estado te prestou algo determinado, mas porque tem renda. O dinheiro vai para o caixa geral e financia saúde, escola, segurança.\n<b>Impostos da União (art. 153 da CF):<\/b>\n<b>I)<\/b> II: Imposto de Importação\n<b>II)<\/b> IE: Imposto de Exportação\n<b>III)<\/b> IR: Imposto de Renda\n<b>IV)<\/b> IPI: Imposto sobre Produtos Industrializados\n<b>V)<\/b> IOF: Imposto sobre Operações Financeiras\n<b>VI)<\/b> ITR: Imposto Territorial Rural\n<b>VII)<\/b> Imposto sobre Grandes Fortunas (previsto, <b>nunca criado<\/b>: falta a lei complementar)\n<b>VIII)<\/b> IS: Imposto Seletivo (criado pela EC 132/2023, vale a partir de 2027)\n<b>Além disso:<\/b> a União pode criar <b>impostos residuais<\/b> (art. 154, I) por lei complementar, e <b>impostos extraordinários de guerra<\/b> (art. 154, II).\n<b>Extrafiscais<\/b> (servem mais para regular a economia do que para arrecadar): <b>II, IE, IPI e IOF<\/b>. O Executivo pode mudar as alíquotas por decreto ou portaria, dentro dos limites da lei."}, {"id": "64", "t": "II: Imposto de Importação", "q": ["Incide sobre produto estrangeiro que entra no país.", "Extrafiscal: protege a indústria nacional.", "Alíquota muda por ato do Executivo; sem anterioridade."], "txt": "<b>Imposto de Importação (II)<\/b> é cobrado quando alguém <b>traz do exterior<\/b> um produto para o Brasil. Exemplo: um comerciante compra celulares da China e eles entram no país: há II.\n<b>Fato gerador (art. 19 do CTN):<\/b> a <b>entrada de produto estrangeiro no território nacional<\/b>. Para a jurisprudência, o momento é o do <b>registro da declaração de importação<\/b> na Receita, e não a data em que o navio chega ao porto.\n<b>Base de cálculo:<\/b> em regra, o <b>valor aduaneiro<\/b> (preço do produto, frete e seguro até o porto).\n<b>Contribuinte:<\/b> o importador, o destinatário da remessa postal e o adquirente de mercadoria apreendida ou abandonada.\n<b>Função extrafiscal:<\/b> encarecer o produto de fora para <b>proteger a indústria brasileira<\/b>, ou baratear para estimular a entrada de bens necessários.\n<b>Regras especiais:<\/b>\n• O <b>Executivo<\/b> pode mudar as alíquotas dentro dos limites da lei (art. 153, §1º). É <b>exceção à legalidade<\/b> quanto à alíquota.\n• <b>Não precisa respeitar<\/b> a anterioridade anual <b>nem<\/b> a nonagesimal.\n• Também não se aplica a regra de não cumulatividade."}, {"id": "65", "t": "IE: Imposto de Exportação", "q": ["Incide sobre produto nacional que sai do país.", "Função extrafiscal: regular a balança comercial.", "Mesmas exceções do II (alíquota por ato do Executivo, sem anterioridade)."], "txt": "<b>Imposto de Exportação (IE)<\/b> é cobrado quando um produto <b>nacional ou nacionalizado sai do Brasil<\/b> para ser vendido ao exterior.\n<b>Fato gerador (art. 23 do CTN):<\/b> a <b>saída<\/b> do produto do território nacional.\n<b>Na prática<\/b> ele é bem pouco usado: o Brasil, em geral, <b>quer estimular<\/b> as exportações. O IE serve para <b>controlar<\/b> o que sai quando o governo quer evitar escassez interna ou proteger algum setor.\n<b>Atenção para não confundir:<\/b>\n• <b>IE<\/b> (imposto federal sobre a saída para o exterior) é diferente do <b>ICMS<\/b> (imposto estadual) e do <b>IPI<\/b>: nas <b>exportações<\/b>, ICMS e IPI não incidem (imunidade, art. 155, §2º, X, a e art. 153, §3º, III).\n• Nas exportações de serviços, o <b>ISS<\/b> também não incide (art. 156, §3º, II).\n<b>Regras especiais (iguais às do II):<\/b>\n• <b>exceção à legalidade<\/b>: o Executivo pode alterar as alíquotas (art. 153, §1º);\n• <b>sem anterioridade<\/b> anual e nonagesimal.\n<b>Contribuinte:<\/b> o exportador.\nA base de cálculo é o preço normal que o produto alcançaria em uma venda em condições de livre concorrência."}, {"id": "66", "t": "IPI: Imposto sobre Produtos Industrializados", "q": ["Incide sobre o produto que passou por industrialização.", "Seletivo (essencialidade) e não cumulativo.", "Anterioridade: só nonagesimal."], "txt": "<b>IPI<\/b> é o imposto federal que incide sobre a <b>saída de produto industrializado<\/b> da fábrica (e também sobre a importação de produto industrializado).\n<b>Industrializar<\/b> é transformar: fazer um móvel de madeira, montar um carro, embalar e rotular de um jeito que muda o produto.\n<b>Fatos geradores (art. 46 do CTN):<\/b> o <b>desembaraço aduaneiro<\/b> do produto importado, a <b>saída<\/b> do estabelecimento industrial ou equiparado e a <b>arrematação<\/b> em leilão de produto apreendido.\n<b>Regras da Constituição (art. 153, §3º):<\/b>\n• <b>Seletivo<\/b>: alíquota maior para supérfluos (cigarro, bebida) e menor para essenciais.\n• <b>Não cumulativo<\/b>: o imposto pago na compra de insumos vira <b>crédito<\/b>, abatido do que se deve na venda.\n• <b>Não incide<\/b> sobre produtos destinados ao <b>exterior<\/b>.\n• Terá <b>redução<\/b> para bens de capital (máquinas).\n<b>Anterioridade:<\/b> pode ter alíquotas mudadas pelo Executivo (exceção à legalidade) e <b>não precisa<\/b> esperar o ano seguinte (sem anterioridade anual), <b>mas deve esperar 90 dias<\/b> (nonagesimal).\n<b>Reforma tributária:<\/b> a partir de <b>2027<\/b>, as alíquotas do IPI ficam em <b>zero<\/b>, exceto para produtos que também são fabricados na <b>Zona Franca de Manaus<\/b>. O papel dele passa ao IBS, CBS e Imposto Seletivo."}, {"id": "67", "t": "IR: Imposto de Renda", "q": ["Incide sobre renda (ganho) e proventos.", "Princípios: generalidade, universalidade e progressividade (art. 153, §2º, I).", "Anterioridade: só a anual; não precisa esperar 90 dias."], "txt": "<b>Imposto de Renda (IR)<\/b> é o imposto sobre o <b>ganho<\/b> de pessoas e empresas.\n<b>Fato gerador (art. 43 do CTN):<\/b> a <b>aquisição de disponibilidade econômica ou jurídica<\/b> de:\n• <b>renda<\/b>: produto do capital, do trabalho ou da combinação dos dois;\n• <b>proventos<\/b>: qualquer outro acréscimo patrimonial (aposentadoria, por exemplo).\n<b>Disponibilidade econômica<\/b> é o dinheiro que você de fato recebeu; <b>jurídica<\/b> é o direito de receber, já garantido (um crédito).\n<b>Três critérios constitucionais (art. 153, §2º, I):<\/b>\n<b>Generalidade:<\/b> atinge todas as pessoas.\n<b>Universalidade:<\/b> alcança todas as rendas, de qualquer origem.\n<b>Progressividade:<\/b> quem ganha mais paga <b>percentual maior<\/b>.\n<b>Contribuintes:<\/b> pessoa física (IRPF) e pessoa jurídica (IRPJ). Muitas vezes o imposto é <b>retido na fonte<\/b> por quem paga (a fonte pagadora).\n<b>Não é renda:<\/b> indenização que apenas repõe um prejuízo (ela não é acréscimo).\n<b>Novidade recente:<\/b> a Lei 15.270/2025 passou a isentar quem recebe até <b>R$ 5 mil por mês<\/b> (com desconto gradual até cerca de R$ 7.350) a partir de 2026, e criou tributação mínima para altas rendas e retenção sobre dividendos.\n<b>Anterioridade:<\/b> o IR é exceção só à <b>nonagesimal<\/b> (cumpre a anual)."}, {"id": "68", "t": "IOF: Imposto sobre Operações Financeiras", "q": ["Incide sobre crédito, câmbio, seguro e títulos/valores mobiliários.", "Extrafiscal: o governo usa para controlar o mercado.", "Sem anterioridade nenhuma."], "txt": "<b>IOF<\/b> é o imposto que o governo federal cobra sobre <b>operações financeiras<\/b>.\n<b>Incide sobre (art. 153, V):<\/b>\n<b>Crédito:<\/b> empréstimos, financiamentos, uso do cheque especial e cartão (quando vira empréstimo).\n<b>Câmbio:<\/b> troca de moeda; é o IOF que aparece quando se compra dólar ou se paga fatura de cartão no exterior.\n<b>Seguro:<\/b> prêmios de seguros.\n<b>Títulos e valores mobiliários:<\/b> aplicações financeiras de curto prazo.\n<b>Ouro como ativo financeiro:<\/b> sujeito exclusivamente ao IOF (art. 153, §5º). A alíquota mínima é de <b>1%<\/b>, e o produto é dividido: <b>30%<\/b> para o Estado de origem e <b>70%<\/b> para o Município de origem.\n<b>Extrafiscal:<\/b> o governo muda a alíquota para <b>esfriar ou esquentar<\/b> a economia (por exemplo, subindo o IOF do câmbio quando quer segurar a saída de dólares).\n<b>Regras especiais:<\/b>\n• O Executivo muda as alíquotas por decreto (exceção à <b>legalidade<\/b>);\n• <b>Não precisa<\/b> respeitar nem a anterioridade <b>anual<\/b> nem a <b>nonagesimal<\/b>.\nÉ um dos tributos de <b>exceção completa<\/b> às anterioridades, junto com II, IE, empréstimo compulsório de guerra/calamidade e imposto extraordinário de guerra."}, {"id": "69", "t": "ITR: Imposto Territorial Rural", "q": ["Incide sobre propriedade, domínio útil ou posse de imóvel rural.", "Progressivo para desestimular terra improdutiva.", "Municípios podem fiscalizar e ficam com 100% se optarem."], "txt": "<b>ITR<\/b> é o imposto federal sobre a <b>propriedade de terra no campo<\/b>.\n<b>Fato gerador (art. 29 do CTN):<\/b> a <b>propriedade, o domínio útil ou a posse<\/b> de imóvel por natureza <b>localizado fora da zona urbana<\/b> do município.\n<b>Imóvel por natureza<\/b> é a terra nua, o solo, e o que está nele naturalmente.\n<b>Regras da Constituição (art. 153, §4º):<\/b>\n• <b>Progressivo<\/b>: alíquotas maiores para imóveis grandes e improdutivos, com o objetivo de <b>desestimular<\/b> manter terra parada (função social da propriedade).\n• <b>Não incide<\/b> sobre <b>pequenas glebas rurais<\/b> definidas em lei, quando exploradas pelo proprietário que <b>não possua outro imóvel<\/b>.\n• Pode ser <b>fiscalizado e cobrado pelos Municípios<\/b> que assim optarem (convênio com a União), e nesse caso o Município fica com <b>100%<\/b> do imposto.\n<b>Quem paga:<\/b> o proprietário, o titular do domínio útil ou o possuidor com ânimo de dono.\n<b>Como saber se é rural ou urbano?<\/b> A lei considera urbana a área definida pelo plano diretor, com pelo menos <b>duas melhorias<\/b> (calçamento, água, esgoto, iluminação, escola, posto de saúde a certa distância), conforme art. 32 do CTN. O ITR e o IPTU <b>não incidem juntos<\/b> no mesmo imóvel.\nEsse critério (<b>localização<\/b>) vale para o IPTU; mas imóvel rural com <b>destinação rural<\/b> comprovada pode pagar ITR mesmo em área urbana, segundo o STJ."}, {"id": "70", "t": "Contribuições: o que são e quais existem", "q": ["Contribuição é tributo com finalidade vinculada (art. 149).", "Tipos: sociais (seguridade), de intervenção (CIDE), de categorias e COSIP.", "Contribuições sociais respeitam só a anterioridade nonagesimal (art. 195, §6º)."], "txt": "<b>Contribuições especiais<\/b> são tributos cobrados <b>para um fim determinado<\/b>. O dinheiro tem destino carimbado. Quem cria, em regra, é a <b>União<\/b> (art. 149 da CF).\n<b>Tipos:<\/b>\n<b>1) Contribuições sociais:<\/b> financiam a <b>seguridade social<\/b> (saúde, previdência e assistência). Exemplos: <b>PIS, COFINS, CSLL<\/b>, contribuição previdenciária do empregador e do empregado.\n<b>2) CIDE (intervenção no domínio econômico):<\/b> serve para regular um setor. Exemplo: CIDE-Combustíveis.\n<b>3) Contribuições de interesse de categorias profissionais ou econômicas:<\/b> anuidades de conselhos (como a da OAB, que a jurisprudência não trata como tributo, mas as dos demais conselhos sim) e sindicais.\n<b>4) COSIP:<\/b> contribuição para <b>iluminação pública<\/b>, cobrada pelos <b>Municípios e DF<\/b> (art. 149-A).\n<b>5) Contribuição de seguridade do servidor<\/b> dos Estados, DF e Municípios, para o regime próprio.\n<b>Anterioridade:<\/b>\n• Contribuições <b>sociais da seguridade<\/b> (art. 195): só a <b>nonagesimal<\/b> (90 dias). Não precisam esperar o ano seguinte.\n• Outras contribuições: <b>as duas<\/b> regras (anual e nonagesimal).\n<b>Importante:<\/b> contribuições <b>não são imposto<\/b>. Por isso não precisam de lei complementar, salvo as <b>residuais<\/b> da seguridade (art. 195, §4º)."}, {"id": "71", "t": "PIS, COFINS, CSLL e CIDE-Combustíveis", "q": ["PIS/COFINS: sobre receita ou faturamento.", "CSLL: sobre o lucro das empresas.", "CIDE-Combustíveis: alíquota por ato do Executivo, só sem anterioridade anual."], "txt": "<b>PIS e COFINS<\/b> são contribuições sociais <b>federais<\/b> cobradas das empresas sobre o <b>faturamento ou a receita<\/b>. O dinheiro financia o seguro-desemprego, o abono salarial e a seguridade.\n<b>Regimes:<\/b> <b>cumulativo<\/b> (alíquotas menores, sem crédito) e <b>não cumulativo<\/b> (alíquotas maiores, com crédito). Na importação também incidem (art. 195, IV).\n<b>CSLL (Contribuição Social sobre o Lucro Líquido):<\/b> incide sobre o <b>lucro<\/b> da empresa (cobrada ao lado do IRPJ).\n<b>Contribuição previdenciária patronal:<\/b> incide sobre a <b>folha de salários<\/b>, os rendimentos pagos e, em certos setores, sobre a receita bruta (desoneração).\n<b>CIDE-Combustíveis (art. 177, §4º):<\/b>\n• incide sobre a importação e a comercialização de petróleo, gás natural, álcool combustível e derivados;\n• o Executivo pode <b>reduzir e restabelecer<\/b> a alíquota por ato próprio, e nesse caso <b>não precisa<\/b> da anterioridade <b>anual<\/b> (só nonagesimal);\n• parte vai para os Estados, DF e Municípios.\n<b>Reforma tributária:<\/b> <b>PIS e COFINS<\/b> serão <b>extintos<\/b>, substituídos pela <b>CBS<\/b>, a partir de <b>2027<\/b>. A <b>CSLL<\/b> continua. A tributação da folha e do lucro (IR) <b>não<\/b> muda.\nOs conceitos de <b>faturamento<\/b> e <b>receita<\/b> já foram muito discutidos: o STF decidiu que o ICMS <b>não integra<\/b> a base do PIS/COFINS (Tema 69)."}, {"id": "72", "t": "Empréstimo compulsório, impostos residuais e de guerra", "q": ["Empréstimo compulsório: só a União, por lei complementar, e é restituído.", "Residuais: lei complementar, não cumulativos, fato gerador novo.", "Extraordinário de guerra: por guerra externa ou sua iminência."], "txt": "<b>Empréstimo compulsório (art. 148 da CF):<\/b> a União pode <b>obrigar<\/b> pessoas a emprestar dinheiro, que depois deve ser <b>devolvido<\/b>. Só pode ser criado por <b>lei complementar<\/b> e em dois casos:\n<b>I)<\/b> <b>calamidade pública<\/b>, guerra externa ou sua iminência: vale <b>sem anterioridade<\/b> nenhuma;\n<b>II)<\/b> <b>investimento público urgente<\/b> e de relevante interesse nacional: obedece às <b>duas<\/b> anterioridades.\nO dinheiro só pode ser usado para o motivo que o justificou (art. 148, parágrafo único).\n<b>Imposto residual (art. 154, I):<\/b> a União pode criar impostos <b>novos<\/b>, que não estão no rol da Constituição, mediante <b>lei complementar<\/b>, desde que sejam <b>não cumulativos<\/b> e <b>não tenham fato gerador ou base de cálculo<\/b> iguais aos de outros impostos já existentes.\n<b>Imposto extraordinário de guerra (art. 154, II):<\/b> pode ser criado <b>na iminência ou no caso de guerra externa<\/b>, <b>compreendido ou não<\/b> em sua competência (ou seja, até sobre fato de outro ente). Por lei ordinária. Sem anterioridade. Suprimido <b>gradativamente<\/b> quando cessadas as causas.\n<b>Importante:<\/b> a Constituição obriga a restituir o <b>empréstimo<\/b>, mas não o <b>imposto<\/b> de guerra."}]}, {"tema": "7. Impostos estaduais e municipais, taxas e contribuição de melhoria", "itens": [{"id": "73", "t": "Impostos dos Estados e dos Municípios: visão geral", "q": ["Estados e DF: ICMS, IPVA e ITCMD (art. 155).", "Municípios e DF: IPTU, ISS e ITBI (art. 156).", "DF acumula os impostos estaduais e municipais."], "txt": "A Constituição divide quem cobra o quê. É a <b>competência tributária<\/b>.\n<b>Estados e Distrito Federal (art. 155):<\/b>\n<b>ICMS<\/b>: Imposto sobre Circulação de Mercadorias e Serviços (compra e venda de mercadorias, transporte entre cidades e comunicação).\n<b>IPVA<\/b>: Imposto sobre a Propriedade de Veículos Automotores.\n<b>ITCMD<\/b>: Imposto sobre Transmissão Causa Mortis e Doação (herança e doação).\n<b>Municípios e Distrito Federal (art. 156):<\/b>\n<b>IPTU<\/b>: Imposto sobre a Propriedade Predial e Territorial Urbana (casa, prédio e terreno na cidade).\n<b>ISS<\/b>: Imposto sobre Serviços (de qualquer natureza, os que não são do ICMS).\n<b>ITBI<\/b>: Imposto sobre Transmissão de Bens Imóveis por ato entre vivos, a título oneroso (compra de imóvel).\n<b>O DF<\/b> pode cobrar <b>os dois grupos<\/b> (arts. 147, 155 e 156), porque não se divide em municípios.\n<b>Territórios federais<\/b> (hoje inexistentes): os impostos estaduais cabem à União e os municipais ao próprio Território, se não for dividido em municípios.\n<b>Reforma tributária:<\/b> ICMS e ISS serão extintos até 2033, substituídos pelo <b>IBS<\/b>. IPVA, ITCMD, ITBI e IPTU continuam, com ajustes da EC 132/2023."}, {"id": "74", "t": "ICMS: quando incide", "q": ["Circulação de mercadorias, transporte intermunicipal e interestadual e comunicação.", "Importação por qualquer pessoa também paga.", "Não incide em exportação nem em deslocamento entre estabelecimentos do mesmo dono."], "txt": "<b>ICMS<\/b> é o maior imposto do país em arrecadação. A lei geral é a <b>LC 87/1996 (Lei Kandir)<\/b>.\n<b>Incide sobre:<\/b>\n<b>1) Circulação de mercadorias:<\/b> a venda de produto. <b>Mercadoria<\/b> é o bem móvel destinado a comércio (o carro que a concessionária vende é mercadoria; o seu carro usado, não).\n<b>2) Transporte<\/b> interestadual e intermunicipal (ônibus entre cidades, frete).\n<b>3) Comunicação<\/b> (telefonia, internet paga).\n<b>4) Importação<\/b> de bens e serviços, <b>por qualquer pessoa<\/b>, mesmo sem ser comerciante (EC 33/2001).\n<b>Não incide:<\/b>\n• <b>exportação<\/b> de mercadorias e de serviços (imunidade, art. 155, §2º, X);\n• <b>deslocamento<\/b> de mercadoria entre <b>estabelecimentos do mesmo titular<\/b> (Súmula 166 do STJ), pois não há venda;\n• alienação de <b>salvados de sinistro<\/b> por seguradoras (Súmula Vinculante 32);\n• operações com <b>ouro<\/b> como ativo financeiro (incide IOF);\n• <b>livros, jornais, periódicos<\/b> e o papel de impressão (imunidade).\n<b>Não cumulativo (art. 155, §2º, I):<\/b> o ICMS pago em compras vira <b>crédito<\/b> para abater o ICMS devido nas vendas. Exemplo: o fabricante vende por R$ 100 com ICMS de R$ 18; o comerciante revende por R$ 150 com ICMS de R$ 27 e deduz os 18 que já foram pagos, recolhendo só <b>R$ 9<\/b>.\n<b>Contribuinte:<\/b> quem pratica o fato com habitualidade ou em volume que caracterize intuito comercial."}, {"id": "75", "t": "ICMS: alíquotas, guerra fiscal e DIFAL", "q": ["Alíquotas interestaduais fixadas pelo Senado.", "Benefícios fiscais exigem convênio no CONFAZ (guerra fiscal).", "DIFAL: diferença de alíquota nas vendas a consumidor final de outro Estado."], "txt": "<b>Alíquotas:<\/b> a lei estadual fixa a alíquota interna (a da venda dentro do Estado). Nas vendas <b>entre Estados<\/b>, as alíquotas são fixadas por <b>resolução do Senado<\/b> (em regra 12%, ou 7% quando o destino é Norte, Nordeste, Centro-Oeste e Espírito Santo e a origem é Sul/Sudeste; 4% para importados).\n<b>Seletividade:<\/b> o ICMS <b>poderá<\/b> ser seletivo, com alíquota menor para o essencial. A LC 194/2022 inseriu no CTN a regra de que combustíveis, energia, comunicações e transporte coletivo são <b>essenciais<\/b> e não podem ter alíquota superior à das operações em geral.\n<b>Guerra fiscal:<\/b> é quando um Estado dá <b>benefício<\/b> (isenção, crédito) sem acordo para atrair empresas, prejudicando os outros. Para evitar, a LC 24/1975 exige <b>convênio<\/b> no <b>CONFAZ<\/b> (decisão de todos os Estados) para conceder benefícios. A LC 160/2017 permitiu <b>convalidar<\/b> benefícios antigos.\n<b>DIFAL (diferencial de alíquota):<\/b> quando um consumidor final compra de outro Estado, o Estado de <b>destino<\/b> cobra a diferença entre sua alíquota interna e a interestadual (EC 87/2015). O STF decidiu (Tema 1093) que a cobrança <b>exige lei complementar<\/b>, que veio com a <b>LC 190/2022<\/b>.\n<b>Combustíveis:<\/b> ICMS <b>monofásico<\/b> (cobrado uma vez só, na origem), com alíquota uniforme por <b>ad rem<\/b> (valor fixo por litro; EC 123/2022 e LC 192/2022)."}, {"id": "76", "t": "ISS: Imposto sobre Serviços", "q": ["Incide sobre serviços da lista da LC 116/2003.", "Alíquota mínima 2% e máxima 5%.", "Não incide sobre exportação de serviços nem locação de bens móveis."], "txt": "<b>ISS<\/b> é o imposto <b>municipal<\/b> (e do DF) sobre <b>serviços<\/b>: médico, advogado, engenheiro, contador, informática, limpeza, obras e muitos outros. A lei nacional é a <b>LC 116/2003<\/b>, que traz uma <b>lista de serviços<\/b>. O que não está na lista não paga ISS.\n<b>Quando o serviço fica fora do ISS:<\/b> o transporte intermunicipal, interestadual e a comunicação pagam <b>ICMS<\/b>.\n<b>Alíquotas (art. 156, §3º, I e art. 8º da LC 116):<\/b>\n• <b>máxima de 5%<\/b>;\n• <b>mínima de 2%<\/b> (para evitar guerra fiscal entre cidades que baixam o imposto para atrair empresas).\n<b>Não incide<\/b>:\n• <b>exportação de serviços<\/b> (quando o resultado é verificado no exterior);\n• <b>locação de bens móveis<\/b> (Súmula Vinculante 31), pois locar não é prestar serviço;\n• serviços em <b>relação de emprego<\/b> e trabalho avulso.\n<b>Quem recebe o imposto?<\/b> Em regra, o <b>Município do estabelecimento do prestador<\/b> (art. 3º). Há exceções (obras, construção civil, limpeza etc.: o local da prestação). As LC 157/2016 e 175/2020 determinaram, para alguns serviços (planos de saúde, cartões, leasing, administração de fundos), que o imposto seja do <b>local do tomador<\/b>.\n<b>Profissionais autônomos e sociedades de profissionais<\/b> (advogados, médicos) pagam ISS em valor <b>fixo<\/b> por profissional (Súmula 663 do STF, DL 406/68).\nDepois da reforma, o ISS é <b>extinto gradualmente<\/b> entre 2029 e 2033."}, {"id": "77", "t": "IPVA: Imposto sobre a Propriedade de Veículos Automotores", "q": ["Incide sobre a propriedade de veículo.", "Alíquotas mínimas fixadas pelo Senado.", "50% do produto vai para o Município do licenciamento."], "txt": "<b>IPVA<\/b> é cobrado todo ano de quem é <b>proprietário<\/b> de veículo automotor (carro, moto, caminhão). A competência é dos <b>Estados e do DF<\/b> (art. 155, III).\n<b>Fato gerador:<\/b> a <b>propriedade<\/b> do veículo. Quem cobra é o Estado onde o veículo está <b>licenciado<\/b>, normalmente onde o dono mora.\n<b>Alíquotas:<\/b> a lei estadual as fixa, observado o <b>mínimo<\/b> estabelecido pelo <b>Senado<\/b>. Podem variar conforme o <b>tipo<\/b>, a <b>utilização<\/b> e o <b>valor<\/b> do veículo.\n<b>Repartição:<\/b> <b>50%<\/b> do IPVA vai para o <b>Município<\/b> onde o veículo foi licenciado (art. 158, III).\n<b>Mudanças da EC 132/2023:<\/b> o IPVA passa a atingir também <b>aeronaves e embarcações<\/b>, com exceções para aeronaves agrícolas, de operadores de serviços aéreos, barcos de pesca, e de pessoas com atividade econômica de transporte. Pode ter <b>alíquotas diferentes<\/b> conforme o impacto ambiental.\n<b>Não incide<\/b> sobre veículos de <b>entidades imunes<\/b> (imunidade recíproca e templos, por exemplo).\n<b>Anterioridade:<\/b> a <b>alíquota<\/b> deve respeitar as duas regras (anual e nonagesimal). Mas a <b>base de cálculo<\/b> (valor do veículo) é exceção à nonagesimal (art. 150, §1º): o Estado pode atualizar a tabela de valores sem esperar 90 dias, mas <b>respeitando a anual<\/b>."}, {"id": "78", "t": "ITCMD: herança e doação", "q": ["Incide sobre herança (causa mortis) e doação.", "Competência: imóvel no Estado onde fica; móveis, no inventário ou domicílio do doador.", "Alíquota máxima fixada pelo Senado: 8%."], "txt": "<b>ITCMD<\/b> é o imposto <b>estadual<\/b> (e do DF) sobre:\n<b>Causa mortis<\/b>: a herança que passa para os herdeiros com a morte.\n<b>Doação<\/b>: quando alguém dá patrimônio a outro, sem receber nada em troca.\n<b>Fato gerador:<\/b> na herança, é a <b>abertura da sucessão<\/b> (morte). A alíquota vigente é a daquele momento (Súmula 112 do STF). Na doação, é o ato da transmissão.\n<b>Quem cobra (art. 155, §1º):<\/b>\n• <b>imóveis<\/b>: o Estado <b>onde o imóvel está<\/b>;\n• <b>bens móveis, títulos e créditos<\/b>: o Estado onde se processa o <b>inventário<\/b> (herança) ou onde tem <b>domicílio o doador<\/b> (doação);\n• se o doador ou o falecido estava <b>no exterior<\/b>, ou os bens estão lá: depende de <b>lei complementar<\/b>. O STF (Tema 825) decidiu que, sem essa LC, os Estados <b>não podem cobrar<\/b>, e ela ainda não foi editada.\n<b>Alíquota máxima:<\/b> o <b>Senado<\/b> a fixa; hoje é <b>8%<\/b> (Resolução 9/92).\n<b>Progressividade:<\/b> o STF já admitia (Tema 21) e a EC 132/2023 passou a <b>exigir<\/b> que seja progressivo em razão do valor transmitido.\n<b>Imunidade e outras regras:<\/b> a EC 132 estabeleceu que o imposto não incide sobre doações e transmissões para <b>instituições sem fins lucrativos<\/b> de relevância pública e social (como entidades assistenciais e beneficentes), nos termos de lei complementar."}, {"id": "79", "t": "ITBI: compra de imóvel", "q": ["Município da localização do imóvel cobra.", "Incide na transmissão onerosa entre vivos de imóvel ou direito real (menos garantia).", "Não incide na integralização de capital, fusão e incorporação."], "txt": "<b>ITBI<\/b> é o imposto <b>municipal<\/b> (e do DF) cobrado quando alguém <b>compra um imóvel<\/b> ou direito real sobre ele (art. 156, II).\n<b>Fato gerador:<\/b> a <b>transmissão onerosa<\/b> (com pagamento), <b>entre vivos<\/b>, de imóveis por natureza ou acessão física e de <b>direitos reais<\/b> sobre imóveis (como a propriedade, o usufruto, a enfiteuse), <b>exceto os de garantia<\/b> (hipoteca e penhor não pagam ITBI), e a cessão de direitos à aquisição.\n<b>Quando nasce?<\/b> Com o <b>registro<\/b> da transmissão no <b>Cartório de Registro de Imóveis<\/b> (no Brasil, quem não registra continua dono só no papel, art. 1.245 do Código Civil). Antes disso, só contrato; não há imposto.\n<b>Quem cobra:<\/b> o Município <b>onde está o imóvel<\/b> (art. 156, §2º, II).\n<b>Não incide (art. 156, §2º, I):<\/b>\n• <b>integralização de capital<\/b> de empresa com imóveis;\n• <b>fusão, incorporação, cisão<\/b> de empresas,\n<b>salvo<\/b> se a empresa tem como atividade principal a compra e venda ou locação de imóveis.\n<b>Base de cálculo:<\/b> o STJ decidiu (Tema 1113) que é o <b>valor do imóvel em condições normais de mercado<\/b>, e <b>não<\/b> está preso ao valor do IPTU. O Município só pode arbitrar se <b>contestar<\/b> o valor declarado, em procedimento com defesa.\n<b>Progressividade:<\/b> o STF vedou alíquotas <b>progressivas<\/b> conforme o valor do imóvel (Súmula 656).\n<b>Herança<\/b> e <b>doação<\/b> não são ITBI: são ITCMD."}, {"id": "80", "t": "IPTU: Imposto Predial e Territorial Urbano", "q": ["Incide sobre propriedade, domínio útil ou posse de imóvel urbano.", "Zona urbana: lei municipal com 2 melhorias (CTN, art. 32).", "Pode ser progressivo no tempo (função social)."], "txt": "<b>IPTU<\/b> é o imposto do <b>Município<\/b> sobre quem tem <b>imóvel na cidade<\/b> (casa, apartamento, terreno).\n<b>Fato gerador (art. 32 do CTN):<\/b> a <b>propriedade, o domínio útil ou a posse<\/b> de imóvel por natureza ou acessão física, na <b>zona urbana<\/b> do município.\n<b>Zona urbana:<\/b> definida em lei municipal, que tenha, pelo menos, <b>dois<\/b> destes melhoramentos: meio-fio ou calçamento com canalização de águas pluviais, abastecimento de água, sistema de esgoto, rede de iluminação pública (com ou sem posteamento) e escola ou posto de saúde a até <b>3 km<\/b>.\n<b>Quem paga:<\/b> o proprietário, o titular do domínio útil (foreiro) ou o possuidor com ânimo de dono. A lei municipal escolhe; o STJ aceita cobrar do <b>promitente comprador<\/b> (quem comprou, sem escritura) e do proprietário (Súmula 399).\n<b>Base de cálculo:<\/b> o <b>valor venal<\/b> do imóvel. O Município só pode <b>atualizar<\/b> o valor por decreto até o <b>índice oficial<\/b> de inflação (Súmula 160 do STJ). Aumento além disso exige <b>lei<\/b>.\n<b>Progressividade:<\/b>\n• <b>fiscal<\/b> (por valor, localização e uso), permitida desde a EC 29/2000 (art. 156, §1º);\n• <b>no tempo<\/b> (extrafiscal): para terreno <b>não edificado, subutilizado ou não utilizado<\/b>, com alíquotas que aumentam a cada ano, até 15% (art. 182, §4º, II)."}, {"id": "81", "t": "Taxas: poder de polícia e serviços públicos", "q": ["Taxa: cobrada pelo poder de polícia ou por serviço público específico e divisível.", "Não pode ter base de cálculo igual à de imposto (SV 29: sem identidade total).", "Diferente de preço público (tarifa), que é contratual."], "txt": "<b>Taxa<\/b> é o tributo que o cidadão paga em troca de uma <b>atuação do Estado<\/b>. Pode ser cobrada pela União, pelos Estados, DF e Municípios, <b>dentro da própria competência<\/b> (art. 145, II).\n<b>Fatos geradores:<\/b>\n<b>1) Exercício do poder de polícia (art. 78 do CTN):<\/b> o Estado limita direitos para proteger o interesse público e fiscaliza. Exemplos: taxa de alvará de funcionamento, taxa de fiscalização ambiental. Deve haver órgão estruturado para fiscalizar (STF).\n<b>2) Serviço público específico e divisível<\/b>, prestado ou posto à disposição:\n<b>Específico<\/b>: dá para saber quem é o beneficiário.\n<b>Divisível<\/b>: dá para medir o uso por cada um.\n<b>Posto à disposição<\/b>: se o uso é <b>obrigatório<\/b> e o serviço está disponível, cobra-se mesmo sem usar (coleta de lixo, por exemplo).\n<b>Não pode ser taxa:<\/b> serviço geral e indivisível (segurança pública, iluminação pública, limpeza de ruas).\n<b>Súmulas Vinculantes:<\/b>\n<b>SV 19:<\/b> taxa de coleta domiciliar de lixo é válida.\n<b>SV 29:<\/b> pode usar elemento da base de cálculo de imposto, desde que <b>sem identidade total<\/b>.\n<b>SV 41:<\/b> iluminação pública <b>não<\/b> pode ser taxa (por isso há a <b>COSIP<\/b>, contribuição).\n<b>Tarifa (preço público)<\/b> é o pagamento de serviço <b>facultativo<\/b> por contrato (ônibus, água concedida), sem regime tributário."}, {"id": "82", "t": "Contribuição de melhoria", "q": ["Cobrada por obra pública que valoriza o imóvel.", "Limites: custo total da obra e acréscimo de valor de cada imóvel.", "Exige lei, edital prévio e prazo para impugnação."], "txt": "<b>Contribuição de melhoria<\/b> é o tributo que a União, os Estados, os Municípios e o DF podem cobrar quando uma <b>obra pública valoriza<\/b> o imóvel de alguém (art. 145, III da CF; arts. 81 e 82 do CTN; DL 195/67).\n<b>Exemplo:<\/b> o Município asfalta e urbaniza uma rua, e as casas que ali ficam passam a valer mais. O dono pode ser chamado a <b>devolver parte<\/b> dessa valorização.\n<b>Condição principal:<\/b> deve haver <b>valorização imobiliária real<\/b> decorrente da obra. Sem valorização, não há contribuição. Só obra pública gera, e é a <b>valorização<\/b> que é cobrada, não a obra em si.\n<b>Dois limites (art. 81 do CTN):<\/b>\n<b>Limite total:<\/b> a soma das contribuições não pode passar do <b>custo da obra<\/b>.\n<b>Limite individual:<\/b> cada proprietário não paga mais do que o <b>acréscimo de valor<\/b> que a obra deu ao seu imóvel.\n<b>Requisitos (art. 82):<\/b>\n• <b>edital<\/b> publicado com memorial descritivo, orçamento, parte do custo a ser financiada e delimitação da área;\n• <b>prazo mínimo de 30 dias<\/b> para o contribuinte impugnar;\n• regulamentação do <b>processo administrativo<\/b> de impugnação.\n<b>Tributo vinculado:<\/b> como a taxa, depende de uma atividade estatal ligada ao contribuinte (a obra).\n<b>Anterioridade:<\/b> obedece as duas.\nOs Municípios usam pouco, por causa da dificuldade de provar a valorização."}]}, {"tema": "8. Reforma tributária do consumo", "itens": [{"id": "83", "t": "Reforma tributária: o que mudou e por quê", "q": ["EC 132/2023 mudou a Constituição; LC 214/2025 criou IBS, CBS e IS; LC 227/2026 ajustou e criou o Comitê Gestor.", "Cinco tributos viram dois: PIS, COFINS, IPI, ICMS e ISS saem; entram CBS e IBS.", "Mudança gradual de 2026 a 2033."], "txt": "O Brasil tinha <b>cinco tributos sobre consumo<\/b> com regras diferentes: <b>PIS, COFINS, IPI<\/b> (federais), <b>ICMS<\/b> (estadual) e <b>ISS<\/b> (municipal). Isso criava burocracia, brigas entre Estados (guerra fiscal) e imposto sobre imposto.\n<b>A reforma (EC 132/2023)<\/b> trocou isso por um modelo de <b>IVA dual<\/b> (imposto sobre valor agregado em duas partes):\n<b>CBS<\/b> (Contribuição sobre Bens e Serviços): federal, substitui <b>PIS, COFINS<\/b> e (em parte) o IPI.\n<b>IBS<\/b> (Imposto sobre Bens e Serviços): de Estados, DF e Municípios, substitui <b>ICMS e ISS<\/b>.\n<b>IS<\/b> (Imposto Seletivo): federal, sobre o que prejudica saúde e meio ambiente.\n<b>Normas que regulamentam:<\/b>\n• <b>LC 214/2025<\/b>: institui IBS, CBS e IS e define as regras gerais;\n• <b>LC 227/2026<\/b>: criou o <b>Comitê Gestor do IBS<\/b> e fez ajustes na LC 214 e no sistema de processo e contencioso.\n<b>O que não muda:<\/b> IR, IOF, ITR, IPTU, IPVA, ITCMD e ITBI continuam.\n<b>Objetivos:<\/b> simplificar, acabar com a cumulatividade (imposto sobre imposto), acabar com a guerra fiscal, cobrar no <b>destino<\/b> (onde o bem é consumido) e tornar o sistema mais justo."}, {"id": "84", "t": "IBS e CBS: como funcionam", "q": ["Incidem sobre operações onerosas com bens, serviços e direitos.", "Não cumulativos: crédito amplo de tudo que a empresa compra.", "Cobrados no destino; não incidem sobre exportação."], "txt": "<b>IBS e CBS<\/b> têm <b>as mesmas regras de funcionamento<\/b> (base de incidência e crédito quase idênticos), mas tem <b>arrecadação separada<\/b>: a CBS vai para a União; o IBS, para Estados e Municípios.\n<b>Fato gerador:<\/b> operações <b>onerosas<\/b> (com contrapartida) com <b>bens materiais ou imateriais, serviços e direitos<\/b>, e também a <b>importação<\/b>. Ou seja, a base é <b>ampla<\/b>, sem distinguir mercadoria de serviço.\n<b>Não cumulatividade ampla:<\/b> a empresa abate do imposto que deve <b>todo o IBS e CBS pago nas suas compras<\/b> (de insumos, aluguel, energia, serviços, bens de uso). É o <b>crédito financeiro<\/b>, bem mais amplo que o do ICMS. Exemplo: a loja vende R$ 1.000 com 28% de imposto (R$ 280); como comprou o produto com R$ 150 de imposto embutido, paga só <b>R$ 130<\/b>.\n<b>Cobrança no destino:<\/b> o imposto vai para o <b>local do consumo<\/b> (onde o consumidor está), e não da origem. Isso reduz a guerra fiscal.\n<b>Exportações:<\/b> <b>não pagam<\/b> e mantêm o crédito. <b>Importações<\/b> pagam, para igualar com o produto nacional.\n<b>Alíquota:<\/b> cada ente fixa a sua, mas deve ser <b>a mesma para todos os bens e serviços<\/b> dentro do seu território (alíquota padrão), com as exceções da lei. O <b>Senado<\/b> define a <b>alíquota de referência<\/b>.\n<b>Quem paga de verdade?<\/b> O <b>consumidor<\/b>: o imposto vai embutido no preço final."}, {"id": "85", "t": "Alíquota padrão, reduzida e alíquota zero", "q": ["Alíquota padrão para quase tudo (estimada em 26% a 28%).", "Redução de 60%: saúde, educação, alimentos, transporte coletivo e outros.", "Redução de 30% para profissionais liberais; zero para cesta básica."], "txt": "A reforma quer um imposto <b>único<\/b> para quase tudo, mas mantém <b>tratamentos diferenciados<\/b> para proteger o consumo essencial. A lista é fechada na lei complementar.\n<b>Alíquota padrão (cheia):<\/b> estimada entre <b>26% e 28%<\/b> (somando IBS e CBS). Há uma <b>trava<\/b> para a carga total não passar de um limite.\n<b>Redução de 60%<\/b> da alíquota para: serviços de <b>educação<\/b> e <b>saúde<\/b>, medicamentos, dispositivos médicos, <b>alimentos<\/b> para consumo humano, <b>produtos agropecuários<\/b>, <b>transporte coletivo<\/b>, produtos de higiene pessoal básicos, insumos agropecuários e atividades artísticas e culturais, entre outros.\n<b>Redução de 30%:<\/b> serviços de <b>profissionais liberais<\/b> de profissões regulamentadas (advogado, contador, médico, engenheiro), segundo a lei.\n<b>Alíquota zero:<\/b> a <b>Cesta Básica Nacional<\/b> de alimentos, certos medicamentos, produtos para pessoas com deficiência, produtos hortícolas, frutas e ovos, entre outros.\n<b>Exemplo prático:<\/b> se a alíquota padrão é 28%, um serviço com redução de 60% paga 11,2%; com redução de 30%, paga 19,6%; com alíquota zero, nada."}, {"id": "86", "t": "Cashback, regimes específicos e Simples Nacional", "q": ["Cashback: devolução de parte do imposto a famílias de baixa renda.", "Regimes específicos: combustíveis, financeiro, saúde, restaurantes etc.", "Simples continua, com opção de recolher IBS/CBS pelo regime geral."], "txt": "<b>Cashback (devolução personalizada):<\/b> o governo <b>devolve<\/b> parte do IBS e da CBS pagos por pessoas de <b>baixa renda<\/b> (inscritas no CadÚnico). A devolução é <b>obrigatória<\/b> em alguns itens, como <b>gás de cozinha<\/b>, energia elétrica, água, esgoto e telecomunicações.\n<b>Por que existe?<\/b> Imposto sobre consumo pesa mais no bolso de quem ganha pouco, porque essa pessoa gasta quase tudo que ganha. O cashback corrige parte disso (princípio da <b>justiça tributária<\/b>).\n<b>Regimes específicos (LC 214):<\/b> setores com regras próprias, como <b>combustíveis, serviços financeiros, planos de saúde, bares e restaurantes, hotelaria<\/b> e <b>sociedades anônimas do futebol<\/b>. A razão é que seria difícil aplicar a regra geral de crédito neles.\n<b>Simples Nacional continua:<\/b> micro e pequenas empresas seguem no Simples. Mas podem <b>optar<\/b> por recolher IBS e CBS <b>pelo regime geral<\/b>. Vantagem: passam <b>crédito<\/b> aos clientes (empresas que compram delas), o que as torna mais atrativas na cadeia."}, {"id": "87", "t": "Imposto Seletivo (IS)", "q": ["Federal; incide sobre o que faz mal à saúde ou ao meio ambiente.", "Extrafiscal e monofásico: cobrado uma só vez.", "Vale a partir de 2027."], "txt": "O <b>Imposto Seletivo (IS)<\/b>, também chamado “imposto do pecado”, é cobrado pela <b>União<\/b> sobre <b>produção, extração, comercialização ou importação<\/b> de bens e serviços <b>prejudiciais à saúde ou ao meio ambiente<\/b> (art. 153, VIII da CF).\n<b>Objetivo:<\/b> não é arrecadar; é <b>desestimular<\/b> o consumo (função extrafiscal) e fazer quem causa dano social pagar por ele.\n<b>Quais bens e serviços (LC 214/2025):<\/b> cigarros e derivados do tabaco, <b>bebidas alcoólicas<\/b> e <b>bebidas açucaradas<\/b>, <b>veículos<\/b> (considerando poluição), <b>embarcações e aeronaves<\/b>, <b>bens minerais<\/b> e <b>concursos de prognósticos<\/b> (apostas). Para a <b>extração mineral<\/b>, a alíquota é no máximo <b>0,25%<\/b>.\n<b>Características:<\/b>\n• <b>incide uma única vez<\/b> na cadeia (monofásico);\n• <b>não incide<\/b> sobre exportações (exceto de bens minerais);\n• as <b>alíquotas<\/b> são fixadas em <b>lei ordinária<\/b> (não por LC).\n<b>Vigência:<\/b> a partir de <b>1º de janeiro de 2027<\/b>.\n<b>IS x IPI:<\/b> o IPI incidia sobre industrializados (qualquer um), com seletividade pela essencialidade. O IS incide sobre produtos <b>nocivos<\/b>, sem exigir industrialização."}, {"id": "88", "t": "Transição: 2026 a 2033", "q": ["2026: teste com CBS 0,9% e IBS 0,1%.", "2027: CBS plena; extinguem PIS/COFINS; IS começa; IPI zerado (menos ZFM).", "2029 a 2032: ICMS e ISS caem aos poucos; 2033: só IBS e CBS."], "txt": "A mudança é <b>gradual<\/b> para as empresas e os governos se adaptarem.\n<b>2026 (ano-teste):<\/b> cobrança <b>de teste<\/b> de <b>CBS 0,9%<\/b> e <b>IBS 0,1%<\/b> nas notas fiscais. O valor pago é <b>compensado<\/b> com PIS/COFINS (e outros tributos), então, na prática, quase não pesa.\n<b>2027:<\/b>\n• a <b>CBS<\/b> começa de verdade, e <b>PIS e COFINS são extintos<\/b>;\n• começa o <b>Imposto Seletivo<\/b>;\n• o <b>IPI<\/b> tem alíquotas zeradas, exceto para produtos que também são produzidos na <b>Zona Franca de Manaus<\/b>.\n<b>2027 e 2028:<\/b> o IBS continua em <b>0,1%<\/b> de teste.\n<b>2029 a 2032:<\/b> o <b>IBS<\/b> sobe gradualmente e <b>ICMS e ISS<\/b> são <b>reduzidos<\/b> na mesma proporção: ICMS/ISS a 90% em 2029, 80% em 2030, 70% em 2031 e 60% em 2032.\n<b>2033:<\/b> <b>ICMS e ISS são extintos<\/b> e o novo sistema funciona integralmente.\n<b>Direitos adquiridos:<\/b> os <b>benefícios fiscais de ICMS<\/b> concedidos por prazo certo e sob condições são mantidos até 2032, e o Fundo de Compensação de Benefícios Fiscais repõe perdas.\n<b>Fundo de Desenvolvimento Regional:<\/b> recebe recursos da União a partir de 2029 para reduzir desigualdades.\nO Senado define as <b>alíquotas de referência<\/b> de cada ano."}, {"id": "89", "t": "Comitê Gestor, split payment e outros pontos novos", "q": ["Comitê Gestor do IBS: arrecada, distribui e regulamenta para Estados e Municípios.", "Split payment: o imposto é separado no momento do pagamento.", "Cashback, crédito ampliado e responsabilidade do comprador."], "txt": "<b>Comitê Gestor do IBS (CG-IBS):<\/b> como o IBS é de <b>todos os Estados e Municípios<\/b>, a Constituição criou um órgão único para <b>uniformizar<\/b> as regras (art. 156-B). É uma entidade <b>pública<\/b> com independência técnica, administrativa, orçamentária e financeira, formada por representantes de Estados e Municípios. Ele <b>regulamenta<\/b> o IBS, <b>arrecada<\/b>, <b>distribui<\/b> o dinheiro e decide o <b>contencioso administrativo<\/b>. A LC 227/2026 detalhou o funcionamento.\n<b>Split payment (pagamento dividido):<\/b> quando o cliente paga (pix, cartão), o sistema financeiro já <b>separa<\/b> a parte do imposto e a envia ao Fisco, ao invés de passar pelas mãos do vendedor. Combate a <b>sonegação<\/b> e a inadimplência.\n<b>Responsabilidade do adquirente:<\/b> quem compra pode responder por não ter pago se o vendedor não recolheu o imposto, a não ser que o pagamento tenha sido feito por <b>split payment<\/b>. Isso força cuidado com fornecedores.\n<b>Neutralidade:<\/b> benefícios fiscais e <b>regimes especiais<\/b> são limitados e só por <b>lei complementar<\/b> (ZFM, Simples e poucos outros).\n<b>Zona Franca de Manaus:<\/b> a Constituição <b>mantém<\/b> a competitividade da ZFM até 2073 e impõe regras para crédito presumido.\n<b>Para concurso:<\/b> a reforma criou os arts. 156-A e 156-B da CF e mudou os arts. 153, 155, 156 e 195."}]}, {"tema": "9. Simples, repartição, fiscalização, processo e ações", "itens": [{"id": "90", "t": "Simples Nacional e MEI", "q": ["Regime que reúne vários tributos em uma única guia (DAS).", "ME até R$ 360 mil; EPP até R$ 4,8 milhões por ano; MEI até R$ 81 mil.", "Opcional, e a opção vale para o ano todo."], "txt": "O <b>Simples Nacional<\/b> (LC 123/2006) é um <b>regime favorecido<\/b> para micro e pequenas empresas, previsto na Constituição (art. 146, III, d e parágrafo único). Em vez de pagar vários tributos separados, a empresa paga <b>uma guia só<\/b>, o <b>DAS<\/b>, com alíquota que depende do tipo de atividade (os anexos) e da receita.\n<b>Quais tributos reúne:<\/b> IRPJ, CSLL, PIS, COFINS, IPI, ICMS, ISS e a contribuição previdenciária patronal (CPP).\n<b>Quem pode:<\/b>\n<b>Microempresa (ME):<\/b> receita bruta anual até <b>R$ 360 mil<\/b>.\n<b>Empresa de pequeno porte (EPP):<\/b> acima disso, até <b>R$ 4,8 milhões<\/b>.\n<b>MEI (Microempreendedor Individual):<\/b> faturamento até <b>R$ 81 mil<\/b> por ano, com pagamento fixo mensal.\n<b>Opção:<\/b> é <b>facultativa<\/b> e <b>irretratável<\/b> para todo o ano-calendário. A empresa opta até o fim de janeiro.\n<b>Quem não pode<\/b> (vedações): empresa com sócio no exterior, com débito com a Fazenda sem exigibilidade suspensa, que atue em certas atividades (instituições financeiras, por exemplo) etc.\n<b>Regras:<\/b> definidas pelo <b>Comitê Gestor do Simples Nacional (CGSN)<\/b>, com União, Estados e Municípios.\n<b>Vantagem:<\/b> menos burocracia e carga menor. <b>Desvantagem:<\/b> os clientes empresas, em regra, aproveitam menos crédito.\nCom a reforma, o Simples <b>permanece<\/b>, e a empresa pode escolher recolher IBS e CBS fora dele."}, {"id": "91", "t": "Repartição das receitas tributárias", "q": ["Quem arrecada divide parte com outros entes (arts. 157 a 162).", "Fundos de participação: FPE (Estados) e FPM (Municípios).", "A União não pode reter nem condicionar a entrega (art. 160)."], "txt": "<b>Repartição de receitas<\/b> é a divisão do dinheiro arrecadado entre União, Estados e Municípios, para equilibrar o <b>federalismo fiscal<\/b>. O ente que arrecada <b>repassa<\/b> parte aos outros.\n<b>Estados e DF ficam com (art. 157):<\/b>\n• o <b>IR retido na fonte<\/b> dos seus servidores e das suas autarquias e fundações;\n• <b>20%<\/b> dos impostos residuais criados pela União.\n<b>Municípios ficam com (art. 158):<\/b>\n• o <b>IR retido na fonte<\/b> dos seus servidores;\n• <b>50% do ITR<\/b> (100% se o Município fiscalizar e cobrar);\n• <b>50% do IPVA<\/b> dos veículos licenciados no território;\n• <b>25% do ICMS<\/b> arrecadado pelo Estado (com 65% pelo valor adicionado e o restante conforme lei estadual).\n<b>Fundos (art. 159):<\/b> a União entrega <b>50%<\/b> do produto do <b>IR e do IPI<\/b> assim: <b>FPE<\/b> (Estados e DF), <b>FPM<\/b> (Municípios), e uma parte para programas de financiamento nas regiões <b>Norte, Nordeste e Centro-Oeste<\/b>. Também entrega <b>10% do IPI<\/b> aos Estados exportadores, proporcionalmente às exportações, e parte da CIDE-Combustíveis.\n<b>Regra de ouro (art. 160):<\/b> é <b>proibido<\/b> à União e aos Estados reter ou restringir a entrega dessas verbas. A exceção é para <b>pagamento de dívidas<\/b> do ente com quem repassa, ou para exigir aplicação mínima em saúde.\n<b>Importante:<\/b> o imposto que o Município arrecada é só <b>dele<\/b>; a repartição é <b>automática<\/b>, sem convênio ou pedido."}, {"id": "92", "t": "Bitributação e bis in idem", "q": ["Bitributação: dois entes diferentes tributam o mesmo fato do mesmo contribuinte.", "Bis in idem: o mesmo ente tributa duas vezes o mesmo fato.", "Lei complementar resolve conflitos de competência."], "txt": "<b>Bitributação:<\/b> quando <b>dois entes federados diferentes<\/b> cobram tributo sobre o <b>mesmo fato<\/b> do <b>mesmo contribuinte<\/b>. Exemplo: o Município e o Estado cobrando imposto sobre o mesmo serviço (ISS e ICMS). É <b>proibida<\/b> pela Constituição, que dividiu as competências de forma <b>rígida<\/b>.\n<b>Bis in idem:<\/b> quando o <b>mesmo ente<\/b> cobra <b>duas vezes<\/b> sobre o mesmo fato gerador. Não é proibido de forma geral (exemplo: PIS e COFINS sobre a receita; IR e CSLL sobre o lucro), mas encontra limites: precisa de <b>autorização constitucional<\/b> e não pode ferir capacidade contributiva ou o confisco.\n<b>Como a Constituição evita bitributação:<\/b>\n• <b>divide as competências<\/b> por tributo (art. 153, 155, 156);\n• proíbe a União de usar fato gerador ou base de cálculo de impostos de outros entes nos <b>impostos residuais<\/b> (art. 154, I);\n• exige <b>lei complementar<\/b> para <b>dispor sobre conflitos de competência<\/b> entre os entes (art. 146, I);\n• define, em lista, os serviços do ISS (LC 116) para separá-los do ICMS.\n<b>Exceção permitida:<\/b> o <b>imposto extraordinário de guerra<\/b> pode atingir fato de outro ente (art. 154, II).\n<b>Hoje:<\/b> o conflito ISS x ICMS vai acabar com o IBS (que substitui os dois)."}, {"id": "93", "t": "Fiscalização tributária: poderes do Fisco", "q": ["Fisco tem amplos poderes de fiscalização (CTN, arts. 194 a 200).", "Termo de início tira a espontaneidade (art. 196).", "Terceiros devem informar, salvo sigilo profissional (art. 197)."], "txt": "<b>Fiscalização<\/b> é a atividade da Administração Tributária de <b>verificar se o contribuinte cumpre<\/b> as obrigações. Está regulada nos arts. 194 a 200 do CTN.\n<b>Poderes (art. 195):<\/b> as autoridades têm <b>amplos poderes<\/b> para examinar mercadorias, livros, arquivos e documentos, sem direito de o contribuinte negar exibição. <b>Mas<\/b> a análise deve se limitar aos <b>pontos investigados<\/b> (Súmula 439 do STF). Livros comerciais e fiscais devem ser <b>guardados<\/b> até a prescrição.\n<b>Início da fiscalização (art. 196):<\/b> a autoridade lavra <b>termo de início<\/b>. Depois dele, o contribuinte perde a <b>espontaneidade<\/b> (não pode mais usar a denúncia espontânea).\n<b>Terceiros (art. 197):<\/b> tabeliães, bancos, corretores, inventariantes, empresas de administração de bens e outros devem <b>prestar informações<\/b> sobre o que souberem dos negócios de terceiros. <b>Exceção:<\/b> informações protegidas por <b>sigilo profissional<\/b> (como o do advogado e do médico).\n<b>Apoio policial (art. 200):<\/b> o Fisco pode requisitar força policial quando impedido."}, {"id": "94", "t": "Sigilo bancário e sigilo fiscal", "q": ["Sigilo bancário: o Fisco pode pedir dados aos bancos sem ordem judicial (STF, Tema 225).", "Sigilo fiscal: a Fazenda não pode divulgar dados do contribuinte (art. 198).", "Exceções: requisição judicial, pedido de autoridade e inscrição em dívida ativa."], "txt": "<b>Sigilo<\/b> é a proteção das informações do contribuinte. Há dois tipos que costumam ser confundidos.\n<b>Sigilo bancário:<\/b> o STF decidiu (Tema 225 e ADIs sobre a LC 105/2001) que o Fisco <b>pode obter dados bancários<\/b> diretamente das instituições <b>sem autorização judicial<\/b>, desde que haja processo administrativo instaurado e regras de sigilo.\n<b>Sigilo fiscal (art. 198):<\/b> é <b>proibido divulgar<\/b> informação sobre a situação econômica ou financeira do contribuinte ou de terceiros, colhida pela Fazenda. <b>Exceções:<\/b> requisição judicial, solicitação de autoridade para fins de Administração Pública, e a <b>divulgação de inscrição em dívida ativa<\/b>."}, {"id": "95", "t": "Processo administrativo fiscal: etapas", "q": ["Impugnação em 30 dias; depois recurso ao conselho (CARF, na esfera federal).", "Órgão julgador é paritário.", "Empate: voto de qualidade (Lei 14.689/2023)."], "txt": "<b>Processo administrativo fiscal<\/b> é a fase em que o contribuinte <b>discute o lançamento dentro do próprio Fisco<\/b>, antes (ou em vez) de ir ao Judiciário. Em cada ente, há uma lei própria; na União vale o <b>Decreto 70.235/1972<\/b>.\n<b>Etapas na esfera federal:<\/b>\n<b>1)<\/b> <b>Lançamento<\/b> (auto de infração ou notificação).\n<b>2)<\/b> <b>Impugnação<\/b> em <b>30 dias<\/b> da intimação, que abre a <b>fase litigiosa<\/b>.\n<b>3)<\/b> <b>Julgamento em 1ª instância<\/b> (Delegacias de Julgamento da Receita).\n<b>4)<\/b> <b>Recurso voluntário<\/b> em 30 dias ao <b>CARF<\/b> (Conselho Administrativo de Recursos Fiscais), órgão paritário (metade fiscais, metade representantes dos contribuintes).\n<b>5)<\/b> Em certos casos, recurso especial à <b>Câmara Superior<\/b>.\n<b>Empate no CARF:<\/b> a Lei 14.689/2023 restabeleceu o <b>voto de qualidade<\/b> do presidente (a favor da Fazenda), com regras para afastar multas."}, {"id": "96", "t": "Processo administrativo fiscal: efeitos e regras", "q": ["Impugnação e recursos suspendem a exigibilidade (CTN, art. 151, III).", "Decisão definitiva favorável extingue o crédito; a contrária não fecha a porta do Judiciário.", "Não pode exigir depósito para recorrer (SV 21)."], "txt": "<b>Efeitos do processo administrativo fiscal:<\/b>\n• enquanto há impugnação ou recurso, o crédito está <b>suspenso<\/b> (art. 151, III do CTN), e não corre prescrição;\n• decisão administrativa <b>definitiva favorável ao contribuinte<\/b> <b>extingue<\/b> o crédito (art. 156, IX) e vincula a Fazenda;\n• decisão <b>desfavorável<\/b> <b>não impede<\/b> ir ao Judiciário (inafastabilidade, art. 5º, XXXV). No Brasil, a coisa julgada administrativa só prende a Administração.\n<b>Proibido exigir depósito ou arrolamento<\/b> de bens como condição para recorrer na via administrativa (Súmula Vinculante 21).\n<b>Consulta:<\/b> o contribuinte pode consultar o Fisco sobre como aplicar a lei; durante a consulta feita no prazo, não correm juros e multa (art. 161, §2º)."}, {"id": "97", "t": "Ações do contribuinte contra o Fisco", "q": ["Anulatória: anula o lançamento ou a CDA, com ou sem depósito (SV 28).", "Declaratória: declara se existe relação jurídica tributária.", "Repetição do indébito e consignação em pagamento."], "txt": "O contribuinte pode ir ao Judiciário de várias formas, antes ou depois da cobrança.\n<b>Ação anulatória de débito fiscal:<\/b> pede para <b>anular<\/b> o lançamento ou a CDA. Pode ser proposta <b>antes ou depois<\/b> da execução fiscal (art. 38 da LEF). <b>Não<\/b> exige depósito prévio (Súmula Vinculante 28). Se quiser <b>suspender<\/b> a cobrança, faz o <b>depósito integral em dinheiro<\/b> (art. 151, II do CTN; Súmula 112 do STJ) ou pede tutela provisória (art. 151, V).\n<b>Ação declaratória:<\/b> pede ao juiz que declare se existe ou não a <b>relação jurídica<\/b> com o Fisco, <b>antes<\/b> do lançamento (exemplo: “sou imune ao tributo X?”). É útil para quem quer segurança sobre fatos futuros.\n<b>Ação de repetição de indébito:<\/b> pede a <b>devolução<\/b> do que foi pago a mais ou indevidamente (art. 165 do CTN). Prazo: 5 anos do pagamento. Para tributos indiretos, só quem <b>suportou o encargo<\/b> pode pedir, ou terceiro com autorização (art. 166).\n<b>Ação de consignação em pagamento (art. 164):<\/b> o contribuinte <b>deposita<\/b> o valor em juízo quando há <b>recusa<\/b> do Fisco em receber, exigência de cumprir obrigação acessória como condição para pagar, ou <b>dois entes<\/b> exigindo o mesmo tributo (bitributação).\n<b>Controle de constitucionalidade:<\/b> o contribuinte comum não propõe ADI, mas pode discutir a constitucionalidade de forma <b>incidental<\/b>, nas ações acima."}, {"id": "98", "t": "Mandado de segurança em matéria tributária", "q": ["Direito líquido e certo; prazo de 120 dias da ciência do ato.", "Não cabe contra lei em tese (Súmula 266 STF).", "Cabe para declarar direito à compensação, mas não para pagar atrasados (Súmulas 213 STJ, 269 STF)."], "txt": "<b>Mandado de segurança (MS)<\/b> é a ação para proteger <b>direito líquido e certo<\/b> (provável por documentos, sem produzir outras provas) contra ato de autoridade pública (art. 5º, LXIX da CF; Lei 12.016/2009).\n<b>No tributário<\/b> é muito usado para impedir uma cobrança ou exigência ilegal. A autoridade coatora (o “Delegado da Receita”, o “Secretário da Fazenda”) é a parte contra quem se impetra.\n<b>Prazo:<\/b> <b>120 dias<\/b> contados da <b>ciência<\/b> do ato impugnado.\n<b>Tipos:<\/b>\n<b>Repressivo:<\/b> contra ato que já ocorreu (uma autuação).\n<b>Preventivo:<\/b> quando há <b>justo receio<\/b> de sofrer um ato ilegal (contribuinte que sabe que será cobrado).\n<b>Súmulas importantes:<\/b>\n• <b>Súmula 266 do STF:<\/b> não cabe MS contra <b>lei em tese<\/b>. É preciso ato concreto ou ameaça concreta.\n• <b>Súmula 213 do STJ:<\/b> o MS é adequado para <b>declarar o direito à compensação<\/b> tributária.\n• <b>Súmula 212 do STJ:<\/b> a compensação <b>não pode ser deferida por liminar<\/b>.\n• <b>Súmula 460 do STJ:<\/b> não cabe MS para <b>convalidar<\/b> compensação já feita pelo contribuinte.\n• <b>Súmula 269 do STF:<\/b> o MS não é substituto de ação de cobrança; os <b>efeitos patrimoniais<\/b> pretéritos devem ser pedidos em ação própria (Súmula 271).\n<b>Liminar:<\/b> suspende a exigibilidade do crédito (art. 151, IV do CTN)."}, {"id": "99", "t": "Crimes contra a ordem tributária", "q": ["Lei 8.137/90 define os crimes (sonegação e apropriação).", "Crime material só depois do lançamento definitivo (SV 24).", "Pagamento integral extingue a punibilidade (Lei 10.684/2003)."], "txt": "Quem <b>engana o Fisco<\/b> para pagar menos tributo pode cometer <b>crime<\/b>. A lei principal é a <b>Lei 8.137/1990<\/b>.\n<b>Art. 1º (crimes materiais):<\/b> suprimir ou reduzir tributo mediante <b>fraude<\/b>, como omitir informação, prestar declaração falsa, falsificar nota, não emitir nota. Pena de reclusão de 2 a 5 anos e multa.\n<b>Art. 2º (crimes formais):<\/b> fazer declaração falsa para eximir-se do tributo, <b>deixar de recolher<\/b> tributo descontado ou cobrado de terceiros (como o ICMS cobrado do cliente ou o imposto retido na fonte), exigir vantagem, entre outros.\n<b>Outros crimes:<\/b> <b>descaminho<\/b> (art. 334 do CP, iludir imposto na entrada de mercadoria), <b>apropriação indébita previdenciária<\/b> (art. 168-A do CP).\n<b>Súmula Vinculante 24:<\/b> o crime do art. 1º, I a IV, só existe depois do <b>lançamento definitivo<\/b> do tributo (fim do processo administrativo). Antes disso, não há justa causa para a ação penal.\n<b>Extinção da punibilidade:<\/b> o <b>pagamento integral<\/b> do tributo, antes ou depois da denúncia, extingue a punibilidade (art. 9º, §2º da Lei 10.684/2003). O parcelamento apenas <b>suspende<\/b> a pretensão.\n<b>Inadimplemento de ICMS declarado:<\/b> o STF (RHC 163.334) admitiu o crime do art. 2º, II, para o contribuinte que, de forma <b>contumaz e dolosa<\/b>, deixa de recolher o ICMS cobrado. Não basta ser devedor."}]}, {"tema": "10. Revisão geral: quadros e pegadinhas", "itens": [{"id": "100", "t": "Quadro geral: todos os impostos num relance", "q": ["União: II, IE, IR, IPI, IOF, ITR, IS (e grandes fortunas, nunca criado).", "Estados/DF: ICMS, IPVA, ITCMD. Municípios/DF: IPTU, ISS, ITBI.", "Use a tabela para revisar antes da prova."], "txt": "Esta tabela junta <b>quem cobra<\/b>, <b>sobre o que<\/b> e <b>quando vale<\/b> a mudança de alíquota. Revise-a depois de estudar os impostos.\n<b>Atenção:<\/b> “Anual” é o ano seguinte; “90 dias” é a anterioridade nonagesimal.\nIPVA e IPTU: a <b>base de cálculo<\/b> (o valor do veículo ou do imóvel) pode mudar sem esperar 90 dias, mas respeitando a anual; a <b>alíquota<\/b> cumpre as duas.", "tab": {"head": ["Imposto", "Quem cobra", "Incide sobre", "Anual?", "90 dias?"], "rows": [["II", "União", "Entrada de produto estrangeiro", "Não", "Não"], ["IE", "União", "Saída de produto nacional", "Não", "Não"], ["IR", "União", "Renda e proventos", "Sim", "Não"], ["IPI", "União", "Produto industrializado", "Não", "Sim"], ["IOF", "União", "Crédito, câmbio, seguro, títulos", "Não", "Não"], ["ITR", "União", "Imóvel rural", "Sim", "Sim"], ["IS", "União", "Bens e serviços nocivos", "Sim", "Sim"], ["ICMS", "Estados e DF", "Circulação de mercadorias, transporte, comunicação", "Sim", "Sim"], ["IPVA", "Estados e DF", "Propriedade de veículo", "Sim (base: sim)", "Sim (base: não)"], ["ITCMD", "Estados e DF", "Herança e doação", "Sim", "Sim"], ["IPTU", "Municípios e DF", "Imóvel urbano", "Sim (base: sim)", "Sim (base: não)"], ["ISS", "Municípios e DF", "Serviços da lista da LC 116", "Sim", "Sim"], ["ITBI", "Municípios e DF", "Compra de imóvel", "Sim", "Sim"]]}}, {"id": "101", "t": "Quadro de prazos que mais caem", "q": ["Decadência e prescrição: 5 anos cada.", "Defesas: 30 dias (impugnação e embargos).", "MS: 120 dias; pagar ou garantir após a citação: 5 dias."], "txt": "Os prazos são uma das matérias mais cobradas. Esta tabela reúne os principais. Se você não lembrar de algum, volte ao tópico indicado.\n<b>Dica:<\/b> o número <b>5<\/b> aparece muito (decadência, prescrição, repetição, prescrição intercorrente), e o <b>30<\/b> também (defesas).\nO prazo para pagar, quando a lei não fixa, é de <b>30 dias<\/b> depois da notificação (art. 160 do CTN).", "tab": {"head": ["Assunto", "Prazo", "Começa a contar"], "rows": [["Decadência (direito de lançar)", "5 anos", "1º dia do ano seguinte (art. 173, I) ou fato gerador (art. 150, §4º)"], ["Prescrição (cobrar o crédito)", "5 anos", "Constituição definitiva do crédito (art. 174)"], ["Prescrição intercorrente", "1 ano suspensa + 5 anos", "Ciência da Fazenda de que não achou devedor ou bens (art. 40 da LEF)"], ["Repetição do indébito", "5 anos", "Extinção do crédito (pagamento indevido) (art. 168)"], ["Pagar ou garantir a execução", "5 dias", "Citação (art. 8º da LEF)"], ["Embargos à execução fiscal", "30 dias", "Garantia da execução (art. 16 da LEF)"], ["Impugnação administrativa federal", "30 dias", "Intimação do lançamento (Decreto 70.235/72)"], ["Mandado de segurança", "120 dias", "Ciência do ato (Lei 12.016/2009)"], ["Impugnação da contribuição de melhoria", "30 dias", "Publicação do edital (art. 82 do CTN)"], ["Pagamento sem prazo na lei", "30 dias", "Notificação do lançamento (art. 160 do CTN)"]]}}, {"id": "102", "t": "Pegadinhas clássicas de prova", "q": ["Imunidade, isenção, não incidência e alíquota zero são coisas diferentes.", "Decadência não suspende nem interrompe; prescrição sim.", "Mero inadimplemento não responsabiliza o sócio."], "txt": "As bancas gostam de trocar uma palavra e mudar o sentido. Veja as armadilhas mais comuns:\n<b>1) Imunidade x isenção:<\/b> imunidade vem da <b>Constituição<\/b> (limite à competência); isenção vem da <b>lei<\/b> (dispensa do pagamento de um tributo que existe).\n<b>2) IR e IPI:<\/b> o <b>IR<\/b> não cumpre a nonagesimal (só a anual); o <b>IPI<\/b> não cumpre a anual (só a nonagesimal). É fácil trocar.\n<b>3) Decadência x prescrição:<\/b> decadência é perder o direito de <b>lançar<\/b>; prescrição é perder o direito de <b>cobrar<\/b>. Só a prescrição se suspende ou se interrompe.\n<b>4) CDA:<\/b> pode ser <b>emendada<\/b> até a sentença dos embargos, mas <b>não<\/b> para trocar o devedor (Súmula 392 do STJ).\n<b>5) Sócio:<\/b> não responde só por a empresa <b>não pagar<\/b> (Súmula 430 do STJ). A <b>dissolução irregular<\/b> autoriza (Súmula 435).\n<b>7) Anistia x remissão:<\/b> <b>anistia<\/b> perdoa <b>penalidade<\/b> (multa); <b>remissão<\/b> perdoa o <b>tributo<\/b>.\n<b>8) Taxa:<\/b> não pode cobrar por serviço geral e indivisível (iluminação, segurança). Para iluminação: <b>COSIP<\/b> (contribuição).\n<b>9) Denúncia espontânea:<\/b> afasta <b>multa<\/b>, mas não os <b>juros<\/b>, e não vale após o <b>início da fiscalização<\/b>.\n<b>10) Sanção política:<\/b> o Estado não pode usar interdição, apreensão ou protesto abusivo para forçar o pagamento (Súmulas 70, 323 e 547 do STF)."}]}];

const m=document.getElementById('m'),back=document.getElementById('back'),ct=document.getElementById('ct');
const SZ=[16,17,19,21];let si=1;try{const v=parseInt(localStorage.getItem('itb_sz'));if(v>=0&&v<SZ.length)si=v}catch(e){}
function applySz(){document.documentElement.style.setProperty('--fs',SZ[si]+'px')}applySz();
document.getElementById('aa').onclick=()=>{si=(si+1)%SZ.length;applySz();try{localStorage.setItem('itb_sz',si)}catch(e){}};
let DONE={};try{DONE=JSON.parse(localStorage.getItem('itb_done')||'{}')}catch(e){}
function save(){try{localStorage.setItem('itb_done',JSON.stringify(DONE))}catch(e){}}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
const ALL=[];D.forEach(g=>g.itens.forEach(i=>{i.tema=g.tema;ALL.push(i)}));
function home(){
 ct.textContent='Direito Tributário fácil';back.style.display='none';m.innerHTML='';
 m.appendChild(el('div','title','<big>iTributário</big>'));
 const q=el('p','sub','Direito Tributário do zero, em linguagem simples.');q.style.textAlign='center';m.appendChild(q);
 const dn=ALL.filter(i=>DONE[i.id]).length;
 const pg=el('div','pg','<i style="width:'+Math.round(100*dn/ALL.length)+'%"></i>');m.appendChild(pg);
 const pn=el('p','nt',dn+' de '+ALL.length+' tópicos lidos');m.appendChild(pn);
 D.forEach(g=>{
  const h=el('div','h');h.textContent=g.tema+' ('+g.itens.length+' tópicos)';m.appendChild(h);
  const me=el('div','menu');
  g.itens.forEach(i=>{const a=el('a',DONE[i.id]?'ok':'','<span class="s"></span><span class="t"></span>');
   a.querySelector('.s').textContent='Tópico '+i.id+(DONE[i.id]?' ✓':'');a.querySelector('.t').textContent=i.t;a.href='#/'+i.id;me.appendChild(a)});
  m.appendChild(me);
 });
}
function topic(id){
 const i=ALL.findIndex(x=>x.id===id);if(i<0)return home();const t=ALL[i];
 back.style.display='';back.href='#/';ct.textContent=t.tema;m.innerHTML='';
 m.appendChild(el('div','h')).textContent='Tópico '+t.id;
 const s=el('p','sub');s.textContent=t.t;m.appendChild(s);
 m.appendChild(el('div','qr','<h4>Quadro resumo</h4><ul>'+t.q.map(x=>'<li>'+x+'</li>').join('')+'</ul>'));
 const d=el('div','fala',t.txt.split('\n').map(p=>'<p>'+p+'</p>').join(''));m.appendChild(d);
 if(t.tab){const w=el('div','tw','<table><thead><tr>'+t.tab.head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+t.tab.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>');m.appendChild(w)}
 const b=el('button','mk'+(DONE[t.id]?' on':''),DONE[t.id]?'✓ Lido':'Marcar como lido');
 b.onclick=()=>{DONE[t.id]=!DONE[t.id];save();b.className='mk'+(DONE[t.id]?' on':'');b.textContent=DONE[t.id]?'✓ Lido':'Marcar como lido'};m.appendChild(b);
 const n=el('div','nv');const pr=el('a',i>0?'':'off','‹ Anterior'),ix=el('a','','Temas'),nx=el('a',i<ALL.length-1?'':'off','Próximo ›');
 pr.href=i>0?'#/'+ALL[i-1].id:'#';ix.href='#/';nx.href=i<ALL.length-1?'#/'+ALL[i+1].id:'#';n.append(pr,ix,nx);m.appendChild(n);
}
function route(){const s=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
 if(s[0])topic(s[0]);else home();window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script></body></html>
