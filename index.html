:root{--paper:#faf2d6;--ink:#191916;--gold:#fbdd67;--red:#ff0807;--salmon:#fe6e52;--ring:#b78445;--bar2:#191916;--fs:17px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper)}
body{color:var(--ink);font:var(--fs)/1.5 'Noto Serif','Droid Serif',Georgia,serif;padding:48px 0 56px;min-height:100vh}
.top{position:fixed;top:0;left:0;right:0;height:48px;background:#000;color:var(--gold);z-index:10;display:flex;align-items:center;padding:0 14px;font:500 14px Roboto,Arial,sans-serif}
.top a,.top button{color:var(--gold);text-decoration:none;background:none;border:0;font:inherit;cursor:pointer}
.top .l{display:flex;align-items:center;gap:6px;min-width:90px;font-size:15px}

.page{max-width:720px;margin:0 auto;padding:10px 16px 90px}

.menu a{display:block;text-decoration:none;color:var(--ink);padding:16px 14px 14px;margin:14px 0;border:2px solid var(--ring);border-radius:12px;background:rgba(255,255,255,.35)}
.menu a:active{background:rgba(183,132,66,.18)}
.menu .t{display:block;color:var(--red);font-size:1.2em;font-weight:700}
.menu .s{display:block;margin-top:6px;font:400 12px Roboto,sans-serif;color:var(--salmon);text-transform:uppercase;letter-spacing:.06em}
.menu a.ok{background:#dcefc9;border-color:#6f9f4c}
.title{text-align:center;margin:18px 0 4px}
.title big{display:block;color:var(--red);font-size:2em;font-weight:700;line-height:1.1}

.nv a{flex:1;text-align:center;text-decoration:none;color:var(--gold);background:#000;border-radius:10px;padding:12px 6px;font:500 15px Roboto,Arial,sans-serif}

tr:nth-child(even) td{background:#fffaf0}
.mk{display:block;width:100%;margin:18px 0 0;padding:12px;border:2px solid #6f9f4c;border-radius:10px;background:#fff;color:#2f5d1a;font:500 15px Roboto,Arial,sans-serif;cursor:pointer}

<script>
const D=[{"tema": "1. Começando do zero", "itens": [{"id": "1", "t": "O que é tributo", "q": ["Tributo = dinheiro que o Estado cobra de você por força de lei.", "Não é multa. Não é escolha sua. A lei manda e o fiscal só cumpre.", "Está no art. 3º do CTN."], "txt": "Tributo é o dinheiro que o Estado cobra das pessoas para pagar suas despesas (escolas, hospitais, ruas, salário de servidores). O artigo 3º do Código Tributário Nacional (CTN) diz: tributo é <b>toda prestação em dinheiro, obrigatória, que não seja multa, criada por lei e cobrada por atividade administrativa vinculada<\/b>.\nVamos traduzir:\n<b>Prestação em dinheiro:<\/b> paga-se em moeda, ou em algo que equivale a dinheiro. Não se paga tributo trabalhando de graça para o Estado.\n<b>Obrigatória:<\/b> você não escolhe pagar. Basta acontecer o fato que a lei descreve.\n<b>Que não seja sanção de ato ilícito:<\/b> multa é castigo por errar; tributo não é castigo. Mas dá para cobrar tributo sobre ganho de atividade ilegal: o que se tributa é o ganho, não a ilegalidade.\n<b>Instituída em lei:<\/b> só a lei cria tributo. O prefeito não inventa imposto por decreto.\n<b>Atividade administrativa vinculada:<\/b> o fiscal não escolhe se cobra nem quanto. Segue a lei, sem “jeitinho”.\nSe faltar um desses elementos, não é tributo."}, {"id": "2", "t": "As cinco espécies de tributo", "q": ["Impostos, taxas, contribuição de melhoria, empréstimo compulsório e contribuições especiais.", "É a teoria pentapartida, adotada pelo STF.", "O nome não manda: o que define a espécie é o fato gerador (art. 4º do CTN)."], "txt": "“Espécie” é o tipo do tributo. O STF adota cinco:\n<b>1) Imposto:<\/b> cobrado sem o Estado te dar nada em troca direta. Você paga porque tem renda, carro, casa. O dinheiro vai para o caixa geral.\n<b>2) Taxa:<\/b> você paga porque usou, ou podia usar, um serviço público específico (como a coleta de lixo da sua casa), ou porque o Estado fiscalizou você (poder de polícia, como o alvará).\n<b>3) Contribuição de melhoria:<\/b> cobrada quando uma obra pública valoriza o seu imóvel.\n<b>4) Empréstimo compulsório:<\/b> o Estado “toma emprestado” de todos, em situação especial (guerra, calamidade), e depois devolve.\n<b>5) Contribuições especiais:<\/b> cobradas para uma finalidade certa: seguridade social (INSS), categorias profissionais, intervenção na economia, iluminação pública.\nO CTN (art. 4º) manda olhar o <b>fato gerador<\/b> (a situação que faz nascer o tributo) para saber qual é a espécie. O nome dado pela lei não importa. Se a lei chamar de “taxa” algo que é imposto, é imposto."}, {"id": "3", "t": "Competência tributária: quem pode criar cada tributo", "q": ["Competência = poder de criar o tributo por lei.", "A Constituição já repartiu: União, Estados, DF e Municípios.", "Não se delega, é facultativa e pode ser exercida ou não."], "txt": "<b>Competência tributária<\/b> é o poder de criar tributos, por lei. Quem divide esse poder é a Constituição, para evitar briga entre União, Estados, Distrito Federal e Municípios.\nExemplos: o Município cria IPTU, ISS e ITBI; o Estado cria ICMS, IPVA e ITCMD; a União cria Imposto de Renda, IPI e outros.\n<b>Características:<\/b>\n<b>Indelegável:<\/b> quem recebeu da Constituição não pode passar o poder de criar tributo a outro ente.\n<b>Facultativa:<\/b> o ente pode não criar. Mas a Lei de Responsabilidade Fiscal diz que ente que não cobra todos os seus impostos fica proibido de receber transferências voluntárias da União ou do Estado.\n<b>Incaducável:<\/b> não perde por falta de uso.\n<b>Inalterável:<\/b> lei não muda o que a Constituição repartiu.\nExistem tipos: <b>privativa<\/b> (só um ente pode: IPTU é do Município), <b>comum<\/b> (todos podem: taxas e contribuição de melhoria), <b>residual<\/b> (União pode criar impostos novos, por lei complementar) e <b>extraordinária<\/b> (União pode criar imposto em caso de guerra, art. 154, II). Se o Estado vizinho e o Município cobram o mesmo tributo sobre o mesmo fato, há conflito de competência."}, {"id": "4", "t": "Competência × capacidade tributária ativa", "q": ["Competência = poder de criar o tributo.", "Capacidade ativa = poder de cobrar e arrecadar.", "Quem cria pode passar só a cobrança (parafiscalidade)."], "txt": "Duas ideias que a prova mistura.\n<b>Competência tributária:<\/b> poder de <b>criar<\/b> o tributo por lei. Não pode ser passado a ninguém.\n<b>Capacidade tributária ativa:<\/b> poder de <b>cobrar, fiscalizar e ficar com o dinheiro<\/b>. Esta pode ser passada. O art. 7º do CTN permite que um ente (por lei) entregue a outra pessoa jurídica de direito público a função de arrecadar e fiscalizar.\nA isso se chama <b>parafiscalidade<\/b>. Exemplo: a União criou a contribuição ao INSS, mas quem cobra e fica com a receita é uma autarquia. Outro: os conselhos de fiscalização profissional (como o CRM e o CREA) cobram anuidades, que têm natureza de contribuição de interesse de categoria profissional.\n<b>Atenção:<\/b> quem recebe a capacidade ativa pode ser pessoa jurídica de direito público. Ao delegar a cobrança, o ente pode revogar a função quando quiser (art. 7º, §2º). O ente <b>não perde<\/b> a competência, só empresta a função de cobrar.\n<b>Regra de bolso:<\/b> criar = competência (não se passa). Cobrar = capacidade ativa (pode se passar)."}, {"id": "5", "t": "Fontes do direito tributário", "q": ["Fonte = de onde vem a regra.", "Constituição, leis, tratados, decretos e normas complementares (art. 96 a 100 CTN).", "Decreto só regulamenta. Não cria nem aumenta tributo."], "txt": "Fonte é o lugar de onde vêm as regras de tributação. O CTN chama de <b>legislação tributária<\/b> (art. 96) o conjunto de leis, tratados, decretos e normas complementares.\n<b>Principais fontes, de cima para baixo:<\/b>\n<b>Constituição:<\/b> manda em tudo. Reparte as competências e fixa os limites.\n<b>Emendas e leis complementares:<\/b> as complementares trazem normas gerais (o próprio CTN é lei ordinária recebida como complementar).\n<b>Leis ordinárias:<\/b> instituem a maior parte dos tributos.\n<b>Medida provisória:<\/b> pode tratar de imposto (art. 62, §2º), mas só produz efeito no ano seguinte se for convertida em lei até o último dia do ano em que foi editada.\n<b>Tratados internacionais:<\/b> prevalecem sobre a lei interna (art. 98 CTN).\n<b>Decretos:<\/b> só detalham a lei (art. 99).\n<b>Normas complementares<\/b> (art. 100): atos de autoridades administrativas (portarias, instruções), decisões administrativas com força normativa, <b>práticas reiteradas<\/b> pelas autoridades e <b>convênios<\/b> entre entes. Quem segue essas normas não paga multa, juros nem correção, mesmo que depois se descubra que estavam erradas.\nResumo: criar ou aumentar tributo só por lei. O resto é complemento."}, {"id": "6", "t": "Lei complementar e normas gerais", "q": ["Normas gerais de direito tributário: só por lei complementar (art. 146, III).", "O CTN faz esse papel.", "Lei complementar também resolve conflito de competência e regula limitações."], "txt": "<b>Lei complementar<\/b> é uma lei mais difícil de aprovar (precisa da maioria absoluta nas duas casas do Congresso). A Constituição só deixa certos temas para ela.\nNo direito tributário, o art. 146 manda que a lei complementar:\n<b>I)<\/b> resolva <b>conflitos de competência<\/b> entre os entes;\n<b>II)<\/b> regule as <b>limitações ao poder de tributar<\/b>, como o que são “entidades sem fins lucrativos” para a imunidade;\n<b>III)<\/b> estabeleça <b>normas gerais<\/b>: definição de tributos e suas espécies, <b>fato gerador, base de cálculo e contribuinte<\/b> dos impostos da Constituição, <b>obrigação, lançamento, crédito, prescrição e decadência<\/b>. Também trata do <b>adequado tratamento ao ato cooperativo<\/b> e do regime favorecido das micro e pequenas empresas (Simples Nacional).\nO CTN é a principal lei de normas gerais. Foi editado como lei ordinária em 1966, mas a Constituição de 1988 aceitou seu conteúdo com força de lei complementar.\n<b>Súmula Vinculante 8 do STF:<\/b> prescrição e decadência de tributo só podem ser tratadas por lei complementar. Lei ordinária que fale outro prazo é inconstitucional.\nLei complementar também é exigida para empréstimo compulsório, imposto residual e imposto sobre grandes fortunas."}, {"id": "7", "t": "Vigência e aplicação da lei tributária", "q": ["Vigência = quando a lei passa a valer.", "Aplicação no tempo: a lei vale para fatos futuros; só retroage em casos especiais (art. 106).", "No espaço: vale só no território do ente (art. 102)."], "txt": "<b>Vigência:<\/b> a lei tributária segue a regra geral: vale a partir da data que ela mesma fixar ou, se for omissa, 45 dias após a publicação. Os tributos ainda têm de respeitar a anterioridade (tema próprio).\n<b>Vigência no espaço (art. 102):<\/b> a lei de um Estado ou Município só vale dentro do seu território, salvo se houver convênio.\n<b>Aplicação no tempo (art. 105):<\/b> a lei vale para fatos ocorridos depois que ela começou a valer. Fato gerador <b>pendente<\/b> é aquele que começou mas ainda não terminou; a lei nova o alcança.\n<b>Retroatividade (art. 106):<\/b> lei só olha para trás em dois casos.\n<b>I) Lei interpretativa:<\/b> a que apenas esclarece o sentido da lei anterior. Mas ela não pode aplicar penalidade a quem agiu de acordo com o entendimento antigo.\n<b>II) Lei benigna em infrações:<\/b> vale para fatos <b>ainda não julgados definitivamente<\/b> quando deixa de tratar o ato como infração, ou quando traz multa menor.\nO <b>art. 144<\/b> diz que o lançamento usa a lei vigente na data do fato gerador. Exceção: leis que ampliam poderes de fiscalização valem para fatos antigos."}, {"id": "8", "t": "Interpretação e integração da lei tributária", "q": ["Interpretar = descobrir o sentido da lei. Integrar = preencher lacuna.", "Ordem: analogia, princípios, equidade (art. 108).", "Analogia não pode criar tributo."], "txt": "<b>Interpretar<\/b> é descobrir o que a lei quer dizer. <b>Integrar<\/b> é preencher um “buraco” quando a lei não trata do caso.\n<b>Ordem de integração (art. 108):<\/b> o aplicador usa, nesta sequência: 1º analogia; 2º princípios gerais de direito tributário; 3º princípios gerais de direito público; 4º equidade (justiça no caso concreto).\n<b>Dois limites importantes:<\/b>\n<b>Analogia<\/b> não pode resultar em cobrar tributo que a lei não prevê.\n<b>Equidade<\/b> não pode dispensar o pagamento do tributo devido.\n<b>Direito privado (arts. 109 e 110):<\/b> a lei tributária pode usar conceitos do Código Civil, mas <b>não pode mudar o conceito<\/b> usado pela Constituição para definir competência. Exemplo: não pode chamar de “faturamento” o que não é.\n<b>Interpretação literal (art. 111):<\/b> para suspensão ou exclusão do crédito, outorga de isenção e dispensa de obrigações acessórias, lê-se a lei ao pé da letra, sem ampliar.\n<b>Dúvida sobre penalidade (art. 112):<\/b> se há dúvida sobre os fatos, a natureza da infração ou a pena, interpreta-se do modo <b>mais favorável ao acusado<\/b> (in dubio pro contribuinte).\nNunca é permitido mudar o sentido de conceito constitucional por lei comum."}, {"id": "9", "t": "Regra-matriz de incidência: os cinco critérios", "q": ["Regra-matriz = o “roteiro” da lei que cria o tributo.", "Hipótese: material, temporal, espacial.", "Consequência: pessoal (quem) e quantitativo (quanto)."], "txt": "Toda lei que cria um tributo responde a cinco perguntas. Esse “roteiro” se chama <b>regra-matriz de incidência<\/b>.\n<b>A hipótese (o “se”):<\/b> descreve a situação que faz nascer o tributo.\n<b>1) Critério material (o quê):<\/b> a ação ou situação. Ex.: ser proprietário de imóvel urbano (IPTU), prestar serviço (ISS).\n<b>2) Critério temporal (quando):<\/b> o instante em que o tributo nasce. Ex.: 1º de janeiro de cada ano (IPTU).\n<b>3) Critério espacial (onde):<\/b> o lugar. Ex.: o imóvel precisa estar na zona urbana do Município.\n<b>A consequência (o “então”):<\/b> diz quem paga e quanto.\n<b>4) Critério pessoal:<\/b> o <b>sujeito ativo<\/b> (quem cobra) e o <b>sujeito passivo<\/b> (quem paga).\n<b>5) Critério quantitativo:<\/b> a <b>base de cálculo<\/b> (o valor sobre o qual se calcula) e a <b>alíquota<\/b> (o percentual aplicado). Ex.: casa de 400 mil reais, alíquota de 1% = 4 mil reais de IPTU.\nHipótese de incidência é a descrição na lei; <b>fato gerador<\/b> é a vez que ela realmente acontece na vida real."}, {"id": "10", "t": "Classificações e funções dos tributos", "q": ["Fiscal arrecada; extrafiscal estimula ou desestimula.", "Direto o contribuinte arca; indireto o custo é repassado.", "Real olha o bem; pessoal olha a pessoa."], "txt": "Os livros dividem os tributos de várias formas. Estas aparecem em prova:\n<b>Pela função:<\/b>\n<b>Fiscal:<\/b> serve para arrecadar (IPTU comum).\n<b>Extrafiscal:<\/b> serve para empurrar comportamento. O IPTU progressivo no tempo castiga o dono de terreno parado; o imposto de importação protege a indústria nacional.\n<b>Parafiscal:<\/b> a receita vai para entidade que não é o ente político (INSS, conselhos).\n<b>Pela repercussão econômica:<\/b>\n<b>Direto:<\/b> quem paga é quem arca com o custo (Imposto de Renda).\n<b>Indireto:<\/b> o custo é repassado ao consumidor, no preço (ICMS, IPI, ISS). Há o <b>contribuinte de direito<\/b> (quem a lei manda pagar: o comerciante) e o <b>de fato<\/b> (quem suporta o custo: o consumidor).\n<b>Pela base:<\/b>\n<b>Real:<\/b> olha só o bem, não a pessoa (IPTU).\n<b>Pessoal:<\/b> considera a situação da pessoa, como renda e dependentes (IR).\n<b>Pela vinculação:<\/b>\n<b>Vinculado:<\/b> depende de uma atividade do Estado voltada para você (taxa).\n<b>Não vinculado:<\/b> não depende (imposto).\nTudo isso ajuda a entender regras como a restituição de tributo indireto, que veremos adiante."}]}, {"tema": "2. Limites do poder de tributar", "itens": [{"id": "11", "t": "Legalidade: só a lei cria ou aumenta tributo", "q": ["Art. 150, I da CF e art. 97 do CTN.", "Só lei cria, aumenta, reduz ou extingue tributo.", "Exceções: alíquotas de II, IE, IPI, IOF, CIDE-combustíveis e ICMS monofásico de combustíveis."], "txt": "<b>Princípio da legalidade:<\/b> ninguém é obrigado a pagar tributo que não esteja numa <b>lei<\/b>. Esta é a defesa mais antiga do contribuinte contra o abuso do governante.\nO art. 97 do CTN lista o que só a lei pode fazer: criar ou extinguir tributo; aumentar ou reduzir tributo; definir o <b>fato gerador<\/b>, o <b>contribuinte<\/b>, a <b>alíquota<\/b> e a <b>base de cálculo<\/b>; criar multas; conceder isenções, anistias e remissões.\n<b>O que NÃO é aumento de tributo:<\/b> atualizar o valor da base de cálculo pela inflação oficial. Isso pode ser feito por decreto. Mas se o Município corrige o IPTU acima da inflação por decreto, é ilegal (Súmula 160 do STJ).\n<b>Exceções:<\/b> em alguns tributos usados para regular a economia, o <b>Poder Executivo<\/b> pode mudar a alíquota por ato próprio, dentro dos limites que a lei fixar:\n• Imposto de Importação (II) e de Exportação (IE);\n• IPI;\n• IOF;\n• CIDE-combustíveis (reduzir e restabelecer);\n• ICMS sobre combustíveis cobrado uma vez só (monofásico), com alíquotas fixadas por convênio entre os Estados.\nAs exceções só valem para <b>alíquotas<\/b>. Criar o tributo continua exigindo lei.\nDica de prova: quando a questão diz que um decreto “criou” ou “aumentou” imposto fora dessa lista, está errada."}, {"id": "12", "t": "Isonomia, capacidade contributiva e vedação ao confisco", "q": ["Isonomia: tratar igual quem está em situação igual (art. 150, II).", "Capacidade contributiva: quem pode mais paga mais (art. 145, §1º).", "Confisco: o tributo não pode sugar o patrimônio (art. 150, IV)."], "txt": "<b>Isonomia (art. 150, II):<\/b> o Estado não pode dar tratamento diferente a contribuintes que estão em situação equivalente. É proibido distinguir por profissão ou função, e pouco importa o nome dado ao rendimento. Tratar diferente é permitido quando a situação for realmente diferente (o pequeno comerciante pode pagar menos que a grande rede).\n<b>Capacidade contributiva (art. 145, §1º):<\/b> sempre que possível, os impostos devem ter caráter pessoal e ser graduados conforme a capacidade econômica de cada um. Quem ganha mais, paga em proporção maior. Por isso o Imposto de Renda é progressivo. Para respeitar isso, a administração pode identificar o patrimônio e a renda do contribuinte, respeitados os direitos individuais.\n<b>Vedação ao confisco (art. 150, IV):<\/b> o tributo não pode ficar tão pesado que tire a propriedade ou a atividade do contribuinte. “Confisco” é tomar o bem sem indenização. Esse limite vale também para <b>multas<\/b>. O STF considerou razoável a multa moratória de 20% e já derrubou multas de 100% ou mais, caso a caso.\nImportante: capacidade contributiva se aplica principalmente aos impostos. Taxas seguem a lógica do serviço, e não da riqueza de quem paga."}, {"id": "13", "t": "Irretroatividade: a lei não olha para trás", "q": ["Art. 150, III, a: não se cobra tributo sobre fato ocorrido antes da lei.", "Vale para criar e para aumentar.", "Retroage só nos casos do art. 106 do CTN."], "txt": "O art. 150, III, “a”, proíbe cobrar tributo sobre <b>fatos geradores ocorridos antes<\/b> do início da vigência da lei que o criou ou aumentou.\n<b>Exemplo:<\/b> se em março de 2027 uma lei nova criar uma taxa, ninguém pode cobrá-la por serviços usados em 2026. Se uma lei aumentar o IPTU, o aumento vale para o fato gerador futuro, não para o IPTU do ano que passou.\nA ideia é <b>segurança jurídica<\/b>: você precisa saber hoje quanto vai pagar amanhã.\n<b>Diferença que cai em prova:<\/b> irretroatividade e anterioridade são princípios <b>diferentes<\/b>.\n• <b>Irretroatividade<\/b> olha para o passado: a lei nova não alcança o que já aconteceu.\n• <b>Anterioridade<\/b> olha para o futuro: mesmo para fatos novos, existe um prazo de espera antes da cobrança.\n<b>Exceção legítima (art. 106 do CTN):<\/b> a lei pode retroagir quando for <b>interpretativa<\/b> (só explica o sentido da anterior) e, em matéria de <b>infrações<\/b>, quando for mais favorável ao infrator e o caso não estiver definitivamente julgado.\nTambém não é afronta a irretroatividade a lei que dá a mesma disciplina a fatos geradores <b>pendentes<\/b> (art. 105), porque o fato só se completa depois."}, {"id": "14", "t": "Anterioridade anual: esperar o ano virar", "q": ["Art. 150, III, b: não cobrar no mesmo ano em que a lei foi publicada.", "Exercício financeiro = 1º de janeiro a 31 de dezembro.", "Lei publicada em dezembro só vale a partir de 1º de janeiro do ano seguinte."], "txt": "<b>Anterioridade anual<\/b> (também chamada de anterioridade de exercício) significa: a lei que <b>cria ou aumenta<\/b> um tributo só pode ser cobrada a partir do <b>ano seguinte<\/b> ao da sua publicação.\n<b>Exercício financeiro<\/b> é o ano civil: de 1º de janeiro a 31 de dezembro.\n<b>Exemplo:<\/b> uma lei publicada em 10 de março de 2026 aumenta o ITBI. Esse aumento só pode ser cobrado a partir de <b>1º de janeiro de 2027<\/b>. Se a lei sair em 30 de dezembro de 2026, o resultado é o mesmo: 1º de janeiro de 2027. Mas aqui entra outra regra (a noventena), que veremos no próximo tópico.\n<b>Para que serve?<\/b> Para evitar surpresa. O empresário planeja o ano seguinte sabendo os tributos que vai pagar.\n<b>O que conta como “aumento”?<\/b> Subir alíquota, aumentar a base de cálculo, ou acabar com um benefício que reduzia o valor devido (isenção) quando isso equivaler, na prática, a pagar mais. O STF considera a anterioridade uma <b>garantia fundamental do contribuinte<\/b>, ou seja, cláusula pétrea: nem emenda constitucional pode tirá-la (ADI 939).\nA anterioridade anual tem <b>exceções<\/b>, que listamos na tabela do tópico 16."}, {"id": "15", "t": "Anterioridade nonagesimal (noventena): esperar 90 dias", "q": ["Art. 150, III, c: 90 dias contados da publicação da lei.", "Soma-se à anterioridade anual: vale o prazo que terminar por último.", "Criada pela EC 42/2003."], "txt": "<b>Anterioridade nonagesimal<\/b>, ou <b>noventena<\/b>, vem do latim “nonaginta”, noventa. A lei que cria ou aumenta tributo só vale depois de <b>90 dias<\/b> contados da data da <b>publicação<\/b> (não da vigência). Foi criada pela EC 42/2003.\n<b>Por que existe?<\/b> Antes dela, uma lei publicada em 30 de dezembro podia ser cobrada em 1º de janeiro, dois dias depois. A noventena evita essa “pegadinha de fim de ano”.\n<b>Regra de ouro:<\/b> as duas anterioridades se <b>somam<\/b>. O tributo só pode ser cobrado depois que <b>ambas<\/b> forem cumpridas.\n<b>Exemplo 1:<\/b> lei publicada em 20 de dezembro de 2026 aumenta o ISS. Anual: 1º/1/2027. Noventena: 20/3/2027. Cobra-se só a partir de <b>20/3/2027<\/b>.\n<b>Exemplo 2:<\/b> lei publicada em 10 de março de 2026. Anual: 1º/1/2027. Noventena: 8/6/2026. O prazo que termina por último é o anual. Cobra-se a partir de <b>1º/1/2027<\/b>.\n<b>Exceções:<\/b> alguns tributos escapam da noventena (como o Imposto de Renda) ou das duas regras (como o Imposto de Importação). Veja a tabela a seguir.\nAs contribuições de seguridade social têm regra própria (art. 195, §6º): só noventena, sem a anual."}, {"id": "16", "t": "Quadro: qual tributo cumpre qual anterioridade", "q": ["Dois prazos: anual (1º de janeiro) e nonagesimal (90 dias).", "Maioria dos tributos: cumpre os dois.", "II, IE, IOF e imposto de guerra: nenhum dos dois."], "txt": "A tabela abaixo mostra o que cada grupo de tributos precisa cumprir. Atenção: as exceções estão no art. 150, §1º, e em outros artigos da Constituição.\n<b>Como memorizar:<\/b>\n• <b>Sem nenhuma anterioridade:<\/b> tributos de uso rápido pelo governo (II, IE, IOF) e tributos de emergência (guerra e calamidade).\n• <b>Só sem a anual (precisa de 90 dias):<\/b> IPI, contribuições da seguridade, e a redução e o restabelecimento de alíquota da CIDE-combustíveis e do ICMS-combustíveis.\n• <b>Só sem a nonagesimal (vale em 1º de janeiro):<\/b> IR, base de cálculo do IPTU e do IPVA.\n• <b>Os dois prazos:<\/b> todos os demais, inclusive o Imposto Seletivo e o IBS.\nA CBS segue a regra das contribuições de seguridade: só noventena.\n<b>Truque:<\/b> IPI e IR têm exceção, mas <b>cada um a sua<\/b>. IPI não precisa esperar o ano, só os 90 dias. IR não precisa esperar os 90 dias, só o ano.", "tab": {"head": ["Tributo", "Anual (ano seguinte)?", "Nonagesimal (90 dias)?", "Quando posso cobrar"], "rows": [["Imposto de Importação (II)", "Não", "Não", "Na hora"], ["Imposto de Exportação (IE)", "Não", "Não", "Na hora"], ["IOF", "Não", "Não", "Na hora"], ["Imposto extraordinário de guerra", "Não", "Não", "Na hora"], ["Empréstimo compulsório de guerra ou calamidade", "Não", "Não", "Na hora"], ["IPI", "Não", "Sim", "Após 90 dias"], ["Contribuições de seguridade social (e CBS)", "Não", "Sim", "Após 90 dias"], ["CIDE-combustíveis e ICMS-combustíveis (restabelecer alíquota)", "Não", "Sim", "Após 90 dias"], ["Imposto de Renda (IR)", "Sim", "Não", "1º de janeiro seguinte"], ["Base de cálculo do IPTU e do IPVA", "Sim", "Não", "1º de janeiro seguinte"], ["Alíquotas de referência do IBS e da CBS (Resolução do Senado)", "Sim", "Não", "1º de janeiro seguinte"], ["ICMS (regra), ISS, IPTU (alíquota), IPVA (alíquota), ITBI, ITCMD, ITR", "Sim", "Sim", "Após os dois prazos"], ["Taxas, contribuição de melhoria, IBS, Imposto Seletivo", "Sim", "Sim", "Após os dois prazos"], ["Impostos residuais, grandes fortunas, empréstimo compulsório de investimento", "Sim", "Sim", "Após os dois prazos"]]}}, {"id": "17", "t": "Outras limitações ao poder de tributar", "q": ["Liberdade de tráfego (art. 150, V).", "Uniformidade geográfica e não discriminação por procedência (arts. 151, I e 152).", "Isenção heterônoma proibida (art. 151, III)."], "txt": "Além dos grandes princípios, a Constituição proíbe outras condutas:\n<b>Liberdade de tráfego (art. 150, V):<\/b> não se pode limitar o trânsito de pessoas ou mercadorias por meio de tributos interestaduais ou intermunicipais. Ressalva: o <b>pedágio<\/b> pelo uso de via conservada pelo Poder Público.\n<b>Uniformidade geográfica (art. 151, I):<\/b> a União não pode cobrar tributo de modo diferente entre Estados ou regiões, mas pode dar incentivos para reduzir desigualdades regionais (como a Zona Franca de Manaus).\n<b>Não discriminação (art. 152):<\/b> Estados, DF e Municípios não podem cobrar mais ou menos conforme a <b>origem ou destino<\/b> do bem ou serviço.\n<b>Isenção heterônoma proibida (art. 151, III):<\/b> a União não pode dar isenção de tributo que é de competência de Estado ou Município. Quem cria é quem isenta. Exceção: <b>tratados internacionais<\/b> assinados pela União (art. 98 do CTN e jurisprudência do STF), e a exportação de serviços, tratada na Constituição.\n<b>Lei específica (art. 150, §6º):<\/b> subsídio, isenção, redução de base de cálculo, crédito presumido, anistia e remissão só por <b>lei específica<\/b>, que trate apenas disso (ou do tributo que regula)."}, {"id": "18", "t": "Imunidade, isenção, não incidência e alíquota zero", "q": ["Imunidade: a Constituição impede o tributo.", "Isenção: a lei dispensa o pagamento.", "Não incidência e alíquota zero: situações parecidas, mas diferentes."], "txt": "Quatro palavras que as bancas gostam de misturar:\n<b>Imunidade:<\/b> está na <b>Constituição<\/b>. Ela retira da lei o poder de tributar certos bens, pessoas ou situações. Nem lei pode cobrar. Ex.: livros não pagam imposto.\n<b>Isenção:<\/b> está na <b>lei<\/b>. O tributo poderia ser cobrado, o fato gerador acontece, mas a lei <b>dispensa o pagamento<\/b> (art. 175 do CTN: exclui o crédito). A lei pode revogar a isenção depois; a imunidade, só mudando a Constituição.\n<b>Não incidência:<\/b> o fato nunca foi definido pela lei como gerador. Ex.: lei do IPTU que não menciona imóvel rural: não há incidência.\n<b>Alíquota zero:<\/b> o fato gerador <b>acontece<\/b>, mas a alíquota fixada é 0%. O resultado é zero, porém continuam as obrigações acessórias (nota fiscal, declaração). Pode ser alterada pelo Executivo em tributos extrafiscais.\n<b>Atenção:<\/b> as imunidades do art. 150, VI valem só para <b>impostos<\/b>. Taxas, contribuição de melhoria e contribuições continuam devidas, salvo imunidade específica.\n<b>Resumo:<\/b> imunidade = limite da Constituição; isenção = benefício da lei; não incidência = fato fora da lei; alíquota zero = o tributo existe, mas vale zero."}, {"id": "19", "t": "Imunidade recíproca", "q": ["Art. 150, VI, a: União, Estados, DF e Municípios não cobram imposto uns dos outros.", "Vale também para autarquias e fundações públicas.", "Não vale para atividade econômica nem para quem paga preço ou tarifa."], "txt": "<b>Imunidade recíproca<\/b> significa: um ente político <b>não pode cobrar imposto<\/b> sobre o <b>patrimônio, a renda e os serviços<\/b> de outro. Exemplo: o Município não cobra IPTU de prédio da União. Isso protege a <b>autonomia<\/b> de cada ente: ninguém deveria depender do dinheiro que o outro pode cobrar.\n<b>Quem é imune:<\/b> União, Estados, DF e Municípios e, pelo §2º, as <b>autarquias e fundações públicas<\/b>, mas <b>só<\/b> no que for ligado às suas finalidades essenciais.\n<b>Quando NÃO vale (§3º):<\/b>\n• atividades econômicas que seguem as regras do mercado, como uma empresa privada;\n• quando o usuário paga <b>preço ou tarifa<\/b> pelo serviço;\n• o <b>promitente comprador<\/b> de imóvel público continua devendo o imposto do bem.\nO STF decidiu que <b>empresa privada<\/b> que explora atividade lucrativa em imóvel público não é imune. Também considerou que os <b>Correios<\/b> (empresa pública federal) têm imunidade por prestarem serviço público essencial, sem concorrência de mercado.\nComo regra, empresas públicas e sociedades de economia mista não são imunes, pois atuam como empresas.\n<b>Lembre:<\/b> só vale para <b>impostos<\/b>."}, {"id": "20", "t": "Imunidade dos templos de qualquer culto", "q": ["Art. 150, VI, b: sem imposto sobre templos.", "O que se protege é a atividade religiosa, não só o prédio.", "Patrimônio, renda e serviços ligados às finalidades essenciais (§4º)."], "txt": "A Constituição protege a <b>liberdade religiosa<\/b> e, para isso, proíbe a cobrança de imposto sobre <b>templos de qualquer culto<\/b>. A palavra “templo” aqui é entendida de modo amplo: não é só o prédio da igreja.\nO STF decidiu que a imunidade alcança o <b>patrimônio<\/b>, a <b>renda<\/b> e os <b>serviços<\/b> da entidade religiosa, desde que tudo isso esteja <b>relacionado com as suas finalidades essenciais<\/b> (art. 150, §4º). Exemplos já aceitos: o terreno, a escola ligada à igreja e o <b>cemitério<\/b> de caráter religioso.\n<b>Imóvel alugado:<\/b> se a entidade aluga um imóvel a terceiros, a imunidade <b>continua<\/b> se o aluguel for aplicado nas atividades essenciais. É a Súmula Vinculante 52.\n<b>Maçonaria:<\/b> o STF entendeu que loja maçônica não é templo, porque a maçonaria não é uma religião.\nImportante:\n• a imunidade vale para <b>impostos<\/b> (IPTU, Imposto de Renda, ITBI sobre os imóveis da entidade). As <b>taxas<\/b> (como a de lixo) continuam devidas;\n• a renda precisa ser usada nas finalidades essenciais; se a entidade desvia o dinheiro para outra coisa, perde o benefício."}, {"id": "21", "t": "Imunidade de partidos, sindicatos, educação e assistência", "q": ["Art. 150, VI, c: partidos, fundações de partido, sindicatos de trabalhadores, entidades de educação e de assistência social sem fins lucrativos.", "Requisitos do art. 14 do CTN.", "Imunidade só para impostos."], "txt": "A alínea “c” do art. 150, VI, protege: <b>partidos políticos<\/b> e suas fundações, <b>sindicatos de trabalhadores<\/b> (não os patronais), e <b>instituições de educação e de assistência social sem fins lucrativos<\/b>, atendidos os requisitos da lei.\nQuem define os requisitos é <b>lei complementar<\/b>: o art. 14 do CTN. A entidade deve:\n<b>I)<\/b> não distribuir nenhuma parcela do patrimônio ou renda a título de lucro ou participação;\n<b>II)<\/b> aplicar <b>integralmente no País<\/b> os seus recursos nos objetivos institucionais;\n<b>III)<\/b> manter <b>escrituração<\/b> de receitas e despesas em livros revestidos de formalidades que garantam a exatidão.\nSe a entidade deixa de cumprir, a autoridade pode <b>suspender<\/b> o benefício (art. 14, §1º).\n<b>Sem fins lucrativos<\/b> não quer dizer que não possa ter superávit; quer dizer que o resultado deve ser aplicado na própria atividade.\n<b>Imóvel alugado:<\/b> mantém a imunidade se o aluguel for aplicado nas finalidades (Súmula Vinculante 52).\nO STF fixou que só <b>lei complementar<\/b> pode definir os requisitos (o “quem é imune”); lei ordinária só trata de como a entidade comprova.\nAs entidades beneficentes de assistência social têm imunidade parecida para as contribuições da seguridade (art. 195, §7º)."}, {"id": "22", "t": "Imunidade de livros, jornais, periódicos e músicas", "q": ["Art. 150, VI, d: livros, jornais, periódicos e o papel de impressão.", "STF: vale para e-book e leitores digitais (SV 57).", "Alínea e: fonogramas e videofonogramas musicais brasileiros."], "txt": "A Constituição quer facilitar a <b>cultura, a informação e a educação<\/b>. Por isso não permite impostos sobre:\n<b>Livros, jornais, periódicos<\/b> e o <b>papel destinado à sua impressão<\/b> (art. 150, VI, “d”). Não importa se o livro é bom, ruim ou caro.\nO STF ampliou ao longo do tempo. Hoje a imunidade alcança:\n• o <b>livro eletrônico<\/b> (e-book) e os aparelhos usados exclusivamente para lê-lo, como o e-reader, ainda que tenham funções extras (<b>Súmula Vinculante 57<\/b>);\n• filmes e papéis fotográficos necessários à publicação de jornais e periódicos (Súmula 657 do STF);\n• listas telefônicas e álbuns de figurinhas, segundo decisões do STF.\nNão alcança, por exemplo, a tinta ou as máquinas de impressão, porque o texto constitucional fala do papel.\n<b>Alínea “e”<\/b> (EC 75/2013): imunidade para <b>fonogramas e videofonogramas musicais<\/b> produzidos no Brasil, com obras de autores brasileiros ou interpretadas por artistas brasileiros, e os suportes e arquivos digitais que os contenham. Fica de fora a etapa de <b>replicação industrial<\/b> de mídias ópticas (CD e DVD).\nÉ imunidade <b>objetiva<\/b>: protege o objeto, e não a empresa que o produz."}, {"id": "23", "t": "Outras imunidades importantes", "q": ["Exportações: IPI, ICMS, contribuições sociais e CIDE.", "ITR: pequenas glebas. ITBI: integralização de capital.", "ICMS: não incide em operação interestadual de petróleo e energia."], "txt": "Existem imunidades espalhadas por toda a Constituição. As mais cobradas:\n<b>Exportação:<\/b> o Brasil não quer exportar tributos. Por isso não incidem:\n• <b>IPI<\/b> sobre produtos industrializados destinados ao exterior (art. 153, §3º, III);\n• <b>ICMS<\/b> sobre mercadorias e serviços para o exterior, com manutenção do crédito (art. 155, §2º, X, “a”);\n• <b>contribuições sociais e CIDE<\/b> sobre receitas de exportação (art. 149, §2º, I);\n• <b>ISS<\/b> sobre exportação de serviços, nos termos da lei complementar (art. 156, §3º, II).\n<b>ITR:<\/b> não incide sobre <b>pequenas glebas rurais<\/b> definidas em lei, quando exploradas pelo proprietário que não tenha outro imóvel (art. 153, §4º, II).\n<b>ITBI:<\/b> não incide na transferência de imóvel para <b>pagar capital<\/b> de empresa, nem em fusão, incorporação, cisão ou extinção, salvo se a atividade principal do comprador for compra e venda, locação ou arrendamento de imóveis (art. 156, §2º, I).\n<b>ICMS:<\/b> não incide em operações <b>interestaduais<\/b> com petróleo, combustíveis derivados e <b>energia elétrica<\/b> (cobra-se no destino).\n<b>ITCMD:<\/b> não incide sobre doações e heranças para instituições sem fins lucrativos de relevância pública e social (regra trazida pela EC 132)."}]}, {"tema": "3. Obrigação tributária e responsabilidade", "itens": [{"id": "24", "t": "Obrigação principal e obrigação acessória", "q": ["Principal: pagar tributo ou multa (art. 113, §1º).", "Acessória: fazer ou deixar de fazer algo para ajudar a fiscalização (art. 113, §2º).", "Quem descumpre a acessória leva multa, e essa multa vira obrigação principal (§3º)."], "txt": "<b>Obrigação tributária<\/b> é o vínculo entre o Estado e o contribuinte. O CTN (art. 113) separa duas:\n<b>Obrigação principal:<\/b> dar dinheiro. É pagar o <b>tributo<\/b> ou a <b>penalidade pecuniária<\/b> (multa). Nasce quando acontece o fato gerador e desaparece junto com o crédito tributário.\n<b>Obrigação acessória:<\/b> é fazer ou deixar de fazer alguma coisa <b>no interesse da arrecadação ou da fiscalização<\/b>. Ela vem da legislação tributária (não só da lei). Exemplos: emitir nota fiscal, entregar a declaração do Imposto de Renda, manter livros contábeis, inscrever-se no cadastro de contribuintes.\n<b>Ponto que cai em prova:<\/b> a acessória pode existir <b>mesmo sem tributo a pagar<\/b>. Uma entidade imune ou uma empresa isenta continua obrigada a emitir nota e entregar declarações.\n<b>Conversão (§3º):<\/b> se você descumprir uma obrigação acessória, a multa que resulta disso é cobrada como obrigação <b>principal<\/b>. Exemplo: atrasar a declaração e levar multa por atraso: essa multa passa a ser crédito tributário, que pode ser inscrito em dívida ativa.\nEm resumo: principal = pagar. Acessória = prestar contas e colaborar."}, {"id": "25", "t": "Fato gerador", "q": ["É a situação definida em lei que faz nascer a obrigação (art. 114).", "Fato gerador da obrigação acessória: art. 115.", "Pecúnia non olet: a validade jurídica do ato não importa (art. 118)."], "txt": "<b>Fato gerador<\/b> é o acontecimento da vida real que, por estar descrito em uma lei, faz nascer o tributo. O CTN diz que ele é a <b>situação definida em lei como necessária e suficiente<\/b> para a obrigação principal existir (art. 114). Exemplos: ser dono de imóvel em 1º de janeiro (IPTU), vender mercadoria (ICMS), prestar serviço (ISS), ganhar renda (IR).\n<b>Fato gerador da acessória (art. 115):<\/b> qualquer situação que a lei manda praticar ou evitar um ato (como emitir nota), sem ser pagamento.\n<b>Quando se considera ocorrido (art. 116):<\/b>\n• <b>situação de fato<\/b> (venda, circulação): quando se reúnem as circunstâncias materiais que a fazem produzir efeitos;\n• <b>situação jurídica<\/b> (propriedade, registro): quando está definitivamente constituída pelo direito.\n<b>Norma antielisiva (art. 116, parágrafo único):<\/b> o Fisco pode desconsiderar atos feitos <b>para esconder<\/b> o fato gerador, desde que siga procedimento definido em lei. <b>Elisão<\/b> é planejamento tributário legal. <b>Evasão<\/b> é fraude.\n<b>Art. 118:<\/b> para tributar, não importa se o ato é válido ou até ilícito. Importa o fato econômico (“dinheiro não tem cheiro”).\nFato gerador (art. 114) não se confunde com “hipótese de incidência”: esta é a descrição na lei; aquele é a ocorrência real."}, {"id": "26", "t": "Sujeito ativo e sujeito passivo", "q": ["Ativo: quem cobra (art. 119).", "Passivo: quem paga (art. 121): contribuinte ou responsável.", "Contratos entre particulares não mudam quem deve ao Fisco (art. 123)."], "txt": "<b>Sujeito ativo<\/b> é quem tem direito de cobrar: a pessoa jurídica de direito público competente (União, Estado, DF ou Município), segundo o art. 119 do CTN.\n<b>Sujeito passivo da obrigação principal<\/b> é quem está obrigado ao pagamento (art. 121). São duas figuras:\n<b>Contribuinte:<\/b> quem tem relação pessoal e direta com o fato gerador. É o dono do imóvel no IPTU, o prestador do serviço no ISS.\n<b>Responsável:<\/b> pessoa que não é contribuinte, mas a lei manda pagar. Ex.: o comprador que assume dívida de imóvel; a empresa que retém o imposto do empregado.\n<b>Obrigação acessória (art. 122):<\/b> sujeito passivo é quem deve cumprir a obrigação.\n<b>Contratos não valem contra o Fisco (art. 123):<\/b> se o contrato de aluguel diz que o inquilino paga o IPTU, vale entre os dois. Mas o Município continua podendo cobrar do proprietário, que é o contribuinte. Depois o proprietário cobra do inquilino.\nA Súmula 399 do STJ diz que é a <b>legislação municipal<\/b> que estabelece o sujeito passivo do IPTU (proprietário, titular do domínio útil ou possuidor, conforme a lei local).\n<b>Dica:<\/b> contribuinte tem relação direta; responsável só tem relação por ordem da lei."}, {"id": "27", "t": "Solidariedade tributária", "q": ["Art. 124: interesse comum ou designação em lei.", "Sem benefício de ordem.", "Interesse comum = interesse jurídico, não só econômico."], "txt": "<b>Solidariedade<\/b> significa que várias pessoas respondem pela <b>mesma dívida inteira<\/b>, e o Fisco pode cobrar de qualquer uma delas. Se uma pagar, a dívida acaba para todas.\nO art. 124 do CTN prevê dois casos:\n<b>I) Interesse comum:<\/b> pessoas que têm <b>interesse jurídico comum<\/b> na situação que gerou o tributo. Ex.: dois donos de um mesmo imóvel respondem solidariamente pelo IPTU. Para o STJ, ter apenas interesse econômico (como empresas do mesmo grupo) não basta por si só.\n<b>II) Designadas por lei:<\/b> quando a lei diz expressamente que são solidárias.\n<b>Sem benefício de ordem (parágrafo único):<\/b> o Fisco não precisa cobrar primeiro de uma pessoa e só depois de outra. Escolhe quem quiser.\n<b>Efeitos (art. 125):<\/b>\n• o pagamento por um <b>aproveita<\/b> aos demais;\n• a isenção ou remissão <b>exonera<\/b> todos, salvo se concedida de forma pessoal; neste caso os outros respondem pelo restante;\n• a interrupção da prescrição contra um <b>vale para todos<\/b>.\nNão confunda: solidariedade (várias pessoas devem tudo) com responsabilidade subsidiária (o segundo só paga se o primeiro não pagar)."}, {"id": "28", "t": "Capacidade e domicílio tributário", "q": ["Capacidade passiva não depende de capacidade civil (art. 126).", "Domicílio: o contribuinte pode eleger (art. 127).", "Fisco pode recusar o domicílio que atrapalha a fiscalização."], "txt": "<b>Capacidade tributária passiva<\/b> é a aptidão de ser sujeito passivo. O art. 126 do CTN diz que ela <b>independe<\/b>:\n<b>I)<\/b> da capacidade civil: criança, adolescente e incapaz podem ser contribuintes (o tributo é cobrado de quem os representa);\n<b>II)<\/b> de a pessoa jurídica estar regularmente constituída: basta ser uma <b>unidade econômica ou profissional<\/b>. Exemplo: sociedade de fato, que funciona sem registro, paga tributo;\n<b>III)<\/b> de a pessoa estar impedida de exercer atividades civis, comerciais ou profissionais.\n<b>Ideia:<\/b> basta realizar o fato gerador para dever tributo.\n<b>Domicílio tributário (art. 127):<\/b> é o endereço oficial para o Fisco enviar notificações. <b>Regra:<\/b> o contribuinte elege. Se não elegeu:\n• <b>pessoa natural:<\/b> a residência habitual, ou o centro habitual das atividades;\n• <b>empresa:<\/b> a sede, ou cada estabelecimento, quanto aos atos dele;\n• <b>pessoa jurídica de direito público:<\/b> qualquer de suas repartições no território.\nSe nada disso servir, vale o lugar onde estão os bens ou ocorreram os fatos.\n<b>Recusa (§2º):<\/b> a autoridade pode <b>recusar o domicílio eleito<\/b> quando ele impossibilitar ou dificultar a fiscalização ou a arrecadação (endereço falso, por exemplo)."}, {"id": "29", "t": "Responsabilidade por sucessão", "q": ["Quem compra imóvel, empresa ou herda assume dívidas tributárias (arts. 129 a 133).", "Imóvel: dívida acompanha o bem (art. 130).", "Empresa: responde integral ou subsidiariamente (art. 133)."], "txt": "<b>Sucessão<\/b> acontece quando outra pessoa entra no lugar do devedor. A dívida tributária “gruda” no que foi transferido.\n<b>Imóveis (art. 130):<\/b> IPTU, taxas e contribuição de melhoria do imóvel passam para o comprador, <b>salvo<\/b> se no título (escritura) houver prova de quitação. Na compra em <b>leilão público<\/b>, a dívida se transfere para o <b>preço pago<\/b>, e não ao arrematante. Por isso, antes de comprar, peça a certidão negativa.\n<b>Bens em geral (art. 131):<\/b> o adquirente responde pelos tributos dos bens. O herdeiro e o cônjuge meeiro respondem até a partilha, <b>limitados<\/b> ao valor do que receberam. O espólio paga o que o falecido devia.\n<b>Empresas (art. 132):<\/b> a nova empresa que surgir de <b>fusão, incorporação ou transformação<\/b> responde pelos tributos devidos até a data do ato.\n<b>Fundo de comércio (art. 133):<\/b> quem compra o estabelecimento e continua a atividade responde:\n• <b>integralmente<\/b>, se o vendedor parar de atuar;\n• <b>subsidiariamente<\/b>, se o vendedor continuar ou recomeçar em seis meses outra atividade.\nPor mudança da LC 118/2005, <b>não há sucessão<\/b> na compra de empresa em <b>falência<\/b> ou <b>recuperação judicial<\/b> (salvo fraude ou parentesco com o devedor)."}, {"id": "30", "t": "Responsabilidade de terceiros: sócios e administradores", "q": ["Art. 134: respondem quando o contribuinte não puder pagar (pais, tutores, inventariante etc.).", "Art. 135: responsabilidade pessoal por excesso de poderes ou infração de lei.", "Não pagar tributo não basta (Súmula 430 do STJ)."], "txt": "Em alguns casos o Fisco pode cobrar de um <b>terceiro<\/b>, que não é o contribuinte, porque ele cometeu falha na administração.\n<b>Art. 134 (responsabilidade subsidiária):<\/b> quando o contribuinte não consegue pagar, respondem <b>pais<\/b> (por filhos menores), <b>tutores e curadores<\/b>, <b>administradores de bens<\/b>, <b>inventariante<\/b>, <b>síndico<\/b>, <b>tabeliães<\/b> e <b>sócios<\/b> de sociedade de pessoas em liquidação. Quanto a multas, só as <b>moratórias<\/b>.\n<b>Art. 135 (responsabilidade pessoal):<\/b> mandatários, prepostos, empregados e <b>diretores, gerentes ou representantes<\/b> de empresas respondem <b>com o próprio patrimônio<\/b> quando agem com <b>excesso de poderes ou infração de lei, contrato social ou estatuto<\/b>.\n<b>Pontos da jurisprudência do STJ:<\/b>\n• <b>Súmula 430:<\/b> só o fato de a empresa não pagar o tributo não gera, por si só, responsabilidade do sócio.\n• <b>Súmula 435:<\/b> presume-se dissolvida irregularmente a empresa que deixa de funcionar no endereço sem avisar os órgãos; isso permite redirecionar a execução ao sócio-gerente.\n• Se o <b>nome do sócio consta da CDA<\/b>, é ele quem precisa provar que não agiu com infração; se não consta, o Fisco precisa provar."}, {"id": "31", "t": "Responsabilidade por infrações", "q": ["Art. 136: em regra, não importa a intenção (responsabilidade objetiva).", "Art. 137: responsabilidade pessoal do agente em crimes e dolo específico.", "Ao contrário do direito penal, aqui basta o fato."], "txt": "<b>Infração tributária<\/b> é descumprir a lei tributária (não pagar, não declarar, fraudar). A multa é a consequência.\n<b>Regra geral (art. 136):<\/b> a responsabilidade por infração <b>independe da intenção<\/b> do agente e da extensão dos efeitos do ato. Ou seja, é <b>objetiva<\/b>: quem descumpre responde, mesmo sem querer. Exemplo: o contribuinte que erra a declaração e paga menos. A lei pode dispor diferente.\n<b>Art. 137 (responsabilidade pessoal do agente):<\/b> a pessoa que praticou o ato responde <b>pessoalmente<\/b> quando a infração:\n• é conceituada por lei como <b>crime ou contravenção<\/b>, salvo se praticada no exercício regular da administração, de mandato, função, cargo ou emprego, ou cumprindo ordem expressa de quem de direito;\n• exige <b>dolo específico<\/b> (intenção especial de lesar o Fisco);\n• decorre direta e exclusivamente de dolo específico de tutores, curadores e outros contra os representados; de empregados contra o empregador; ou de diretores e gerentes contra a empresa.\nAssim, a regra de que pouco importa a intenção sofre exceção quando o <b>dolo<\/b> é central: a pena recai sobre o autor, e não sobre a empresa.\n<b>Lembre:<\/b> responsabilidade pelas multas é objetiva em regra; com dolo, é pessoal."}, {"id": "32", "t": "Denúncia espontânea", "q": ["Art. 138: confessar a infração antes de ser fiscalizado afasta a multa.", "Deve pagar o tributo e os juros (ou depositar o valor arbitrado).", "Não vale depois do início de fiscalização."], "txt": "<b>Denúncia espontânea<\/b> é o contribuinte contar ao Fisco que errou, por vontade própria, antes de ser descoberto. O CTN (art. 138) premia essa honestidade: a <b>responsabilidade pela infração é excluída<\/b>, ou seja, não paga multa.\n<b>Condições:<\/b>\n• a denúncia deve vir <b>acompanhada do pagamento<\/b> do tributo devido e dos <b>juros de mora<\/b>;\n• ou, se o valor ainda não está calculado, do <b>depósito<\/b> da quantia arbitrada pelo Fisco.\n<b>Quando não vale (parágrafo único):<\/b> a denúncia só é espontânea se feita <b>antes<\/b> do início de qualquer procedimento administrativo ou medida de fiscalização relacionada com a infração. Se o fiscal já iniciou o procedimento (termo de início de fiscalização), o contribuinte perdeu o direito.\n<b>Jurisprudência (Súmula 360 do STJ):<\/b> o benefício <b>não se aplica<\/b> aos tributos sujeitos a lançamento por homologação que foram <b>declarados, mas pagos com atraso<\/b>. A lógica é: se o contribuinte já declarou o valor ao Fisco, não há o que confessar; a multa de mora fica.\nO parcelamento do débito <b>não equivale<\/b> a pagamento para fins de denúncia espontânea (STJ).\nÉ um ato <b>de boa-fé<\/b>. A multa de mora, sendo punição pelo atraso, é afastada quando há denúncia válida."}, {"id": "33", "t": "Substituição tributária", "q": ["Substituto: a lei põe um terceiro no lugar do contribuinte desde o início.", "Para frente: paga-se antes do fato gerador (art. 150, §7º da CF).", "Se o fato não ocorrer, há restituição imediata e preferencial."], "txt": "<b>Substituição tributária<\/b> é quando a lei manda uma pessoa (<b>substituto<\/b>) pagar o tributo no lugar da pessoa que realmente realiza o fato gerador (<b>substituído<\/b>). Facilita a fiscalização: fica mais fácil controlar poucas fábricas do que milhares de lojas.\n<b>Tipos:<\/b>\n• <b>Para trás (diferimento):<\/b> o pagamento é adiado para etapa posterior da cadeia.\n• <b>Concomitante:<\/b> a retenção é feita no momento do fato (retenção na fonte de IR, por exemplo).\n• <b>Para frente (progressiva):<\/b> a lei manda recolher <b>antes<\/b> do fato gerador. A indústria paga o ICMS de toda a cadeia, calculando o preço final que será cobrado do consumidor.\nA Constituição (art. 150, §7º) permite a substituição para frente, assegurando <b>restituição imediata e preferencial<\/b> se o fato gerador presumido <b>não ocorrer<\/b>.\n<b>Jurisprudência do STF:<\/b> se o fato ocorrer por <b>valor menor<\/b> que o presumido, também há direito à restituição da diferença (Tema 201).\n<b>Diferença para a transferência:<\/b> na <b>substituição<\/b>, o terceiro assume desde o nascimento da obrigação; na <b>transferência<\/b> (sucessão, responsabilidade de sócio), a responsabilidade surge depois, em razão de algum fato."}]}, {"tema": "4. Crédito tributário e lançamento", "itens": [{"id": "34", "t": "Crédito tributário: o que é e quando nasce", "q": ["Obrigação nasce com o fato gerador. Crédito se forma com o lançamento.", "Crédito decorre da obrigação principal e tem a mesma natureza (art. 139).", "Só muda nos casos do CTN (art. 141)."], "txt": "Primeiro entenda a sequência:\n<b>1) Fato gerador:<\/b> você vendeu uma mercadoria ou virou dono de um imóvel. Aí nasce a <b>obrigação tributária<\/b>.\n<b>2) Lançamento:<\/b> a administração (ou o próprio contribuinte, nos tributos “por homologação”) apura quanto é devido. É o <b>lançamento<\/b> que dá liquidez e certeza à dívida e a transforma em <b>crédito tributário<\/b> (art. 142).\n<b>3) Cobrança:<\/b> se não pagar, o crédito pode ser inscrito em dívida ativa e cobrado em execução fiscal.\nO art. 139 diz que o crédito decorre da obrigação principal e <b>tem a mesma natureza<\/b> dela. O art. 140 diz que as circunstâncias que <b>modificam o crédito<\/b> (extensão, garantias, privilégios) <b>não afetam<\/b> a obrigação que o originou. E o art. 141 determina que o crédito só pode ser modificado, extinto ou ter a exigibilidade suspensa ou excluída <b>nos casos previstos no CTN<\/b>, nunca por vontade do fiscal.\n<b>Dica:<\/b> obrigação é o vínculo (nasce com o fato). Crédito é a dívida já apurada (nasce com o lançamento). A obrigação existe antes do crédito. Por isso o Fisco precisa lançar antes de cobrar, e tem prazo para lançar (decadência)."}, {"id": "35", "t": "Lançamento: o que é", "q": ["Procedimento da administração para apurar e cobrar o tributo (art. 142).", "É ato vinculado e obrigatório, privativo da autoridade.", "Constituição definitiva: quando não cabe mais discussão."], "txt": "<b>Lançamento<\/b> é o procedimento administrativo que o Fisco faz para:\n• verificar se o <b>fato gerador<\/b> aconteceu;\n• determinar a <b>matéria tributável<\/b> (o que será taxado);\n• calcular o <b>valor<\/b> devido;\n• identificar o <b>sujeito passivo<\/b>;\n• propor a <b>multa<\/b>, se houver (art. 142).\nEle é <b>privativo da autoridade administrativa<\/b> e <b>vinculado e obrigatório<\/b>: o fiscal não escolhe lançar ou não, sob pena de responsabilidade funcional.\n<b>Natureza:<\/b> o lançamento <b>declara<\/b> que a obrigação já existe e <b>constitui<\/b> o crédito tributário.\n<b>Regra aplicável (art. 144):<\/b> usa-se a lei vigente na data do <b>fato gerador<\/b>, mesmo que seja revogada depois. Exceções: leis que criam novos critérios de apuração ou ampliam os poderes de investigação do Fisco valem para fatos antigos.\n<b>Constituição definitiva:<\/b> é o momento em que o lançamento já foi notificado e <b>não cabe mais impugnação<\/b> (acabou o prazo de defesa ou a decisão administrativa é final). É daí que conta a <b>prescrição<\/b> para cobrar.\n<b>Súmula 436 do STJ:<\/b> se o contribuinte entrega a declaração reconhecendo a dívida, o crédito já está constituído, e o Fisco não precisa lançar de novo."}, {"id": "36", "t": "As três modalidades de lançamento", "q": ["De ofício: o Fisco faz tudo (art. 149).", "Por declaração: o contribuinte informa, o Fisco calcula (art. 147).", "Por homologação: o contribuinte calcula e paga, o Fisco confere depois (art. 150)."], "txt": "O lançamento pode ser feito de três jeitos, conforme quem faz o trabalho:\n<b>1) De ofício (direto, art. 149):<\/b> a autoridade faz sozinha, sem ajuda do contribuinte. Ex.: o carnê do <b>IPTU<\/b> que chega pelo correio. Também é usado para <b>revisar<\/b> lançamentos, quando há erro, omissão, fraude ou dolo.\n<b>2) Por declaração (misto, art. 147):<\/b> o contribuinte presta <b>informações<\/b> sobre a matéria de fato, e o Fisco <b>calcula<\/b> o tributo e notifica. Ex.: imposto de importação em algumas hipóteses. O contribuinte só pode retificar a declaração para <b>reduzir o tributo<\/b> se provar o erro e <b>antes<\/b> de ser notificado do lançamento.\n<b>3) Por homologação (autolançamento, art. 150):<\/b> o contribuinte <b>calcula e paga<\/b> sozinho, antes de qualquer exame do Fisco. A administração depois <b>homologa<\/b> (confirma). Se não disser nada em <b>5 anos<\/b> do fato gerador, considera-se homologado (homologação tácita) e o crédito se extingue, salvo dolo, fraude ou simulação. Ex.: <b>ICMS, IPI, ISS, Imposto de Renda<\/b> da maioria dos casos.\n<b>Pagamento antecipado extingue o crédito sob condição<\/b>: se o Fisco, dentro do prazo, achar diferença, pode lançar o que faltou."}, {"id": "37", "t": "Alteração e revisão do lançamento", "q": ["Art. 145: só muda por impugnação, recurso de ofício ou revisão de ofício.", "Art. 146: mudança de critério jurídico só vale para fatos futuros.", "Revisão só enquanto não houver decadência."], "txt": "Depois de <b>notificado<\/b> ao contribuinte, o lançamento <b>não pode ser alterado livremente<\/b>. O art. 145 só aceita três caminhos:\n<b>I)<\/b> <b>impugnação<\/b> do sujeito passivo (a defesa do contribuinte);\n<b>II)<\/b> <b>recurso de ofício<\/b> (quando o julgador de primeira instância dá razão ao contribuinte e o processo sobe automaticamente para revisão);\n<b>III)<\/b> <b>iniciativa de ofício<\/b> da autoridade, nos casos do art. 149 (erro, omissão, dolo, fraude, simulação, fato não conhecido ao tempo do lançamento).\n<b>Erro de fato × erro de direito:<\/b>\n• <b>Erro de fato<\/b> (a autoridade se enganou sobre o que aconteceu): pode ser corrigido por revisão, sem problema.\n• <b>Mudança de critério jurídico<\/b> (a autoridade mudou de interpretação da lei): só vale para <b>fatos geradores futuros<\/b> (art. 146). Isso protege a <b>confiança<\/b> do contribuinte, que seguiu a orientação oficial.\n<b>Prazo:<\/b> a revisão de ofício só pode ocorrer <b>enquanto o direito de lançar não estiver extinto<\/b> pela decadência (art. 149, parágrafo único).\nPor fim, o fiscal que lançar com erro pode ser responsabilizado funcionalmente, mas o contribuinte também deve ficar atento aos prazos de defesa."}, {"id": "38", "t": "Suspensão da exigibilidade do crédito", "q": ["Art. 151: seis causas. Mnemônico: Moratória, Depósito, Reclamações/recursos, Liminar em MS, Liminar/tutela em outras ações, Parcelamento.", "O crédito continua existindo, só não pode ser cobrado.", "Obrigações acessórias continuam."], "txt": "<b>Suspender a exigibilidade<\/b> é “pausar” a cobrança: o crédito segue existindo, mas o Fisco não pode cobrá-lo nem executar o contribuinte enquanto durar a suspensão. Também libera a emissão de certidão positiva com efeitos de negativa.\nAs causas do art. 151 do CTN:\n<b>I) Moratória:<\/b> prazo maior dado por lei para pagar (arts. 152 a 155). Não vale para dolo, fraude ou simulação.\n<b>II) Depósito do montante integral:<\/b> o contribuinte deposita <b>em dinheiro<\/b> o valor todo (Súmula 112 do STJ). Se perder, o depósito vira pagamento.\n<b>III) Reclamações e recursos administrativos:<\/b> enquanto o contribuinte discute dentro do processo administrativo.\n<b>IV) Liminar em mandado de segurança.<\/b>\n<b>V) Liminar ou tutela antecipada em outras ações.<\/b>\n<b>VI) Parcelamento<\/b> (art. 155-A): só por lei específica; não afasta juros e multa.\nImportante: a suspensão <b>não dispensa as obrigações acessórias<\/b> (parágrafo único). O contribuinte continua entregando declarações.\nO <b>Supremo<\/b> afastou o depósito prévio como condição para discutir a dívida (Súmulas Vinculantes 21 e 28). Depositar é uma opção, não obrigação.\nA suspensão também <b>paralisa o prazo de prescrição<\/b>, mas não impede o Fisco de lançar para evitar a decadência."}, {"id": "39", "t": "Extinção do crédito tributário: as 11 formas", "q": ["Art. 156: onze causas.", "Pagamento, compensação, transação, remissão, prescrição e decadência etc.", "Dação em pagamento só de bens imóveis."], "txt": "<b>Extinguir<\/b> o crédito é acabar com a dívida. O art. 156 lista <b>onze<\/b> formas:\n<b>I) Pagamento.<\/b>\n<b>II) Compensação:<\/b> o contribuinte usa um crédito que tem contra a Fazenda para pagar a dívida (precisa de lei).\n<b>III) Transação:<\/b> acordo com concessões mútuas que encerra o litígio.\n<b>IV) Remissão:<\/b> perdão da dívida, por lei.\n<b>V) Prescrição e decadência:<\/b> o Fisco perdeu o prazo.\n<b>VI) Conversão do depósito em renda:<\/b> o valor depositado em juízo vai para os cofres públicos.\n<b>VII) Pagamento antecipado e homologação do lançamento<\/b> (tributos por homologação).\n<b>VIII) Consignação em pagamento julgada procedente.<\/b>\n<b>IX) Decisão administrativa irreformável:<\/b> favorável ao contribuinte e que não pode mais ser desfeita na via administrativa.\n<b>X) Decisão judicial passada em julgado.<\/b>\n<b>XI) Dação em pagamento de bens imóveis:<\/b> o contribuinte entrega um imóvel para quitar. Só <b>imóveis<\/b> e na forma da lei (o STF já derrubou lei estadual que permitia entregar bens móveis).\n<b>Atenção:<\/b> a lista é <b>taxativa<\/b>. Remissão, anistia e isenção <b>não<\/b> são a mesma coisa: remissão extingue; isenção e anistia <b>excluem<\/b> o crédito (veremos adiante).\nDica: se pagou, está extinto; se o prazo passou, também; se só discutiu, está suspenso."}, {"id": "40", "t": "Pagamento: onde, quando, juros e multa", "q": ["Pagamento no domicílio do devedor, 30 dias após notificação (arts. 159 e 160).", "Atraso: juros de 1% ao mês se a lei não dispuser diferente (art. 161).", "Multa de mora e multa de ofício são diferentes."], "txt": "O CTN trata do pagamento nos arts. 157 a 164:\n<b>Onde (art. 159):<\/b> na repartição do <b>domicílio<\/b> do sujeito passivo, se a lei não disser outra coisa.\n<b>Quando (art. 160):<\/b> se a lei não fixar prazo, o vencimento é <b>30 dias<\/b> após a notificação do lançamento.\n<b>Atraso (art. 161):<\/b> quem paga depois do vencimento deve <b>juros de mora<\/b>, qualquer que seja o motivo, sem prejuízo da multa. Se a lei não disser diferente, os juros são de <b>1% ao mês<\/b>. Muitas leis usam a taxa Selic.\n<b>Multa:<\/b> não confunda. A <b>multa de mora<\/b> pune só o atraso (na União, 0,33% ao dia, até 20%). A <b>multa de ofício<\/b> pune quem foi autuado por pagar ou declarar errado (na União, 75%, e 150% se houver fraude).\n<b>Não prejudica:<\/b> o pagamento de um tributo <b>não presume<\/b> o pagamento de outros (art. 158). A multa não dispensa o pagamento integral do tributo (art. 157).\n<b>Imputação em pagamento (art. 163):<\/b> quando o mesmo devedor tem várias dívidas e paga menos do que o total, a ordem é: primeiro as dívidas por obrigação própria; depois as de responsabilidade; entre elas, contribuições de melhoria, taxas e impostos; e dentro de cada grupo, as mais antigas."}, {"id": "41", "t": "Compensação, transação e remissão", "q": ["Compensação: crédito do contribuinte contra o Fisco (art. 170).", "Transação: acordo para encerrar litígio (art. 171).", "Remissão: perdão por lei (art. 172)."], "txt": "Três formas de extinguir o crédito que <b>dependem de lei<\/b>:\n<b>Compensação (art. 170):<\/b> o contribuinte tem dinheiro a receber do Fisco (por exemplo, pagou imposto a mais) e o utiliza para <b>abater a dívida<\/b>. Só vale se a lei autorizar e se o crédito for <b>líquido e certo<\/b>.\n<b>Atenção:<\/b> o art. 170-A proíbe compensar antes do <b>trânsito em julgado<\/b> quando o crédito ainda é discutido em juízo. O STJ também entende que a compensação não pode ser dada por <b>liminar<\/b> (Súmula 212).\n<b>Transação (art. 171):<\/b> o Fisco e o contribuinte fazem <b>concessões mútuas<\/b> (desconto de juros, multa, parcelamento) para encerrar uma discussão. Na União vale a Lei 13.988/2020; Estados e Municípios precisam de lei própria.\n<b>Remissão (art. 172):<\/b> é o <b>perdão do débito<\/b>. Só por lei, com despacho fundamentado, considerando: situação econômica do devedor; erro ou ignorância escusáveis; valor muito pequeno do crédito; equidade; ou condições peculiares de uma região.\n<b>Diferença que cai em prova:<\/b> remissão perdoa o <b>tributo<\/b> (dívida já existente); anistia perdoa a <b>multa<\/b> (penalidade por infração)."}, {"id": "42", "t": "Exclusão do crédito: isenção e anistia", "q": ["Art. 175: isenção e anistia excluem o crédito.", "Isenção: perdoa o tributo antes do lançamento (prevista em lei).", "Anistia: perdoa a multa por infrações passadas."], "txt": "<b>Excluir<\/b> o crédito é impedir que ele seja formado. As duas formas (art. 175):\n<b>Isenção:<\/b> a lei dispensa o tributo. O fato gerador acontece, mas o Estado abre mão do crédito. Regras:\n• decorre sempre de <b>lei<\/b> que diga as condições, os tributos e o prazo (art. 176);\n• não alcança <b>taxas e contribuição de melhoria<\/b> nem tributos criados depois, salvo lei em contrário (art. 177);\n• pode ser <b>revogada<\/b> por lei, observada a anterioridade, <b>salvo<\/b> se concedida por <b>prazo certo e sob condições<\/b> (isenção onerosa). Nesse caso o contribuinte tem direito até o fim do prazo (Súmula 544 do STF);\n• quando não é geral, depende de <b>despacho da autoridade<\/b> a pedido do interessado (art. 179).\n<b>Anistia (arts. 180 a 182):<\/b> perdoa <b>infrações já cometidas<\/b> (multas), antes da lei que a concede. <b>Não vale<\/b> para crimes, contravenções, atos praticados com dolo, fraude ou simulação, nem para conluio.\n<b>Importante:<\/b> a exclusão <b>não dispensa as obrigações acessórias<\/b> (art. 175, parágrafo único).\n<b>Diferença rápida:<\/b> isenção atinge o <b>tributo<\/b>; anistia atinge a <b>multa<\/b>; remissão perdoa o <b>crédito já lançado<\/b>."}, {"id": "43", "t": "Decadência: o Fisco perde o direito de lançar", "q": ["Prazo: 5 anos.", "Regra geral: do 1º dia do ano seguinte àquele em que podia lançar (art. 173, I).", "Por homologação com pagamento parcial: do fato gerador (art. 150, §4º)."], "txt": "<b>Decadência<\/b> é a <b>perda do direito<\/b> de fazer o lançamento por ter passado o prazo. Se o Fisco não lançou a tempo, não pode mais cobrar aquele tributo. Atinge o <b>direito<\/b>, e não a ação. Por isso, o prazo <b>não se suspende nem se interrompe<\/b>, e só <b>lei complementar<\/b> pode tratar dela (SV 8).\nPrazo: <b>5 anos<\/b>. O ponto de partida varia:\n<b>1) Regra geral (art. 173, I):<\/b> conta-se do <b>1º dia do exercício seguinte<\/b> àquele em que o lançamento poderia ter sido feito. Exemplo: fato gerador em março de 2022. O lançamento já podia ser feito em 2022. O prazo começa em 1º/1/2023 e termina em 31/12/2027.\n<b>2) Homologação com pagamento parcial (art. 150, §4º):<\/b> o prazo é de 5 anos <b>do fato gerador<\/b>. Isso vale se o contribuinte pagou antecipadamente <b>parte<\/b> do tributo e não houve dolo, fraude ou simulação.\n<b>3) Homologação sem nenhum pagamento, ou com dolo, fraude ou simulação:<\/b> usa-se o art. 173, I (esse é o entendimento do STJ no repetitivo REsp 973.733).\n<b>4) Anulação por vício formal (art. 173, II):<\/b> 5 anos da decisão definitiva que anulou o lançamento.\n<b>Medida preparatória:<\/b> a notificação de medida indispensável ao lançamento antecipa o início do prazo (parágrafo único do art. 173)."}, {"id": "44", "t": "Prescrição: o Fisco perde o direito de cobrar", "q": ["Prazo: 5 anos contados da constituição definitiva (art. 174).", "Interrompida pelo despacho que ordena a citação (art. 174, parágrafo único).", "Prescrição extingue o crédito (art. 156, V)."], "txt": "<b>Prescrição<\/b> é a perda do direito de <b>cobrar em juízo<\/b> uma dívida que já foi lançada, por ter passado o prazo. O art. 174 diz: a ação de cobrança <b>prescreve em 5 anos<\/b>, contados da <b>constituição definitiva do crédito<\/b>. Antes disso há apenas decadência; depois do lançamento definitivo, só prescrição.\n<b>Quando começa:<\/b> quando o lançamento fica definitivo (acabou o prazo de defesa ou a decisão administrativa é final). Nos tributos por homologação com declaração, quando a declaração é entregue ou, se for posterior, no vencimento.\n<b>Interrupção (reinicia os 5 anos), parágrafo único do art. 174:<\/b>\n<b>I)<\/b> despacho do juiz que ordena a <b>citação<\/b> na execução fiscal (desde a LC 118/2005);\n<b>II)<\/b> protesto judicial;\n<b>III)<\/b> qualquer ato judicial que constitua o devedor em mora;\n<b>IV)<\/b> ato inequívoco, mesmo extrajudicial, de <b>reconhecimento do débito<\/b> (um pedido de parcelamento, por exemplo).\n<b>Suspensão:<\/b> as causas do art. 151 (como o parcelamento) suspendem a contagem.\n<b>Atenção:<\/b> o juiz pode reconhecer a prescrição <b>de ofício<\/b>, ou seja, sem pedido do contribuinte (Súmula 409 do STJ). E, como a decadência, ela <b>extingue o crédito<\/b> (art. 156, V). Só lei complementar trata do tema (SV 8)."}, {"id": "45", "t": "Quadro: decadência × prescrição", "q": ["Decadência: antes do lançamento. Atinge o direito de lançar.", "Prescrição: depois do lançamento definitivo. Atinge a ação de cobrança.", "Ambas: 5 anos. Ambas extinguem o crédito (art. 156, V)."], "txt": "A tabela compara os dois institutos lado a lado. Guarde esta frase: <b>decadência é antes do lançamento; prescrição é depois<\/b>.\nA decadência vai do fato gerador até o crédito ser lançado. A prescrição começa quando o lançamento fica definitivo e vai até a cobrança judicial. Por isso <b>não se pode ter as duas ao mesmo tempo sobre o mesmo crédito<\/b>: uma termina e a outra começa.\nOutro ponto de prova: só a prescrição pode ser <b>interrompida<\/b> (zerar e recomeçar) e <b>suspensa<\/b> (pausar). A decadência corre sem parar. Ambas só podem ser tratadas por <b>lei complementar<\/b> (Súmula Vinculante 8).", "tab": {"head": ["Ponto", "Decadência", "Prescrição"], "rows": [["O que o Fisco perde", "O direito de lançar (constituir o crédito)", "O direito de cobrar judicialmente"], ["Quando acontece", "Antes do lançamento", "Depois do lançamento definitivo"], ["Prazo", "5 anos", "5 anos"], ["Começa quando", "1º dia do ano seguinte (art. 173, I) ou fato gerador (art. 150, §4º)", "Constituição definitiva do crédito (art. 174)"], ["Interrompe ou suspende?", "Não", "Sim (art. 174, parágrafo único e art. 151)"], ["Base legal", "Arts. 150, §4º e 173 do CTN", "Art. 174 do CTN"], ["Efeito", "Extingue o crédito (art. 156, V)", "Extingue o crédito (art. 156, V)"], ["Pode ser reconhecida de ofício?", "Sim", "Sim (Súmula 409 do STJ)"], ["Quem trata do tema", "Lei complementar (SV 8)", "Lei complementar (SV 8)"]]}}, {"id": "46", "t": "Repetição do indébito: pedir de volta o que pagou a mais", "q": ["Art. 165: quem pagou indevidamente tem direito à restituição.", "Prazo de 5 anos (art. 168).", "Tributo indireto: só quem arcou com o custo pode pedir (art. 166)."], "txt": "<b>Repetição de indébito<\/b> é o pedido de devolução do tributo pago por engano, a mais ou sem lei que o justificasse (art. 165). Independe de protesto prévio.\n<b>Casos:<\/b> cobrança ou pagamento <b>espontâneo<\/b> indevido; erro na identificação do sujeito, na alíquota ou nos cálculos; reforma, anulação ou revogação de decisão condenatória.\n<b>Prazo (art. 168):<\/b> <b>5 anos<\/b>, contados:\n• da <b>extinção do crédito<\/b> (data do pagamento indevido);\n• ou do <b>trânsito em julgado<\/b> / decisão definitiva que reformou o lançamento.\nNos tributos por homologação, a LC 118/2005 fixou 5 anos <b>do pagamento antecipado<\/b> (o STF validou para ações ajuizadas a partir de 9/6/2005).\n<b>Se a Fazenda negar o pedido administrativo<\/b>, o contribuinte tem <b>2 anos<\/b> para ajuizar ação anulatória dessa decisão (art. 169).\n<b>Tributos indiretos (art. 166):<\/b> em tributos como o ICMS, só pode pedir a restituição quem <b>provar que arcou com o encargo<\/b>, ou quem estiver autorizado por quem arcou (o consumidor). Sem isso o contribuinte de direito teria ganho indevido.\n<b>Atualização:<\/b> juros SELIC desde o pagamento indevido (Lei 9.250/95)."}, {"id": "47", "t": "Garantias do crédito tributário", "q": ["Art. 184: todos os bens do devedor respondem, até os gravados.", "Só não respondem os bens absolutamente impenhoráveis.", "Garantias podem ser criadas por lei (art. 183)."], "txt": "<b>Garantias<\/b> são mecanismos que ajudam o Fisco a receber. O art. 183 diz que a lista do CTN <b>não é exclusiva<\/b>: outras leis podem criar mais garantias, mas elas não mudam a natureza do crédito.\n<b>Art. 184:<\/b> responde pelo crédito <b>a totalidade dos bens e rendas<\/b>, de qualquer origem, do devedor, do espólio ou da massa falida. Inclusive os bens que já estejam gravados com ônus real (como hipoteca) ou com cláusula de inalienabilidade ou impenhorabilidade. A única exceção são os bens que a lei declara <b>absolutamente impenhoráveis<\/b>, como o <b>bem de família<\/b> (Lei 8.009/90), roupas e utensílios, salários (em regra) e instrumentos de trabalho.\n<b>Privilégios especiais:<\/b> a lei pode dar preferência a bens determinados.\nExemplos de garantias do Fisco: a <b>preferência<\/b> no pagamento (tópico seguinte); a <b>presunção de fraude<\/b> na venda de bens após a inscrição em dívida ativa (art. 185); a <b>indisponibilidade de bens<\/b> (art. 185-A); a exigência de <b>certidão negativa<\/b> para certos atos (arts. 205 a 208).\n<b>Fique atento:<\/b> o devedor que vende um bem de forma a ficar sem patrimônio pode ter a venda desconsiderada em relação ao Fisco, como veremos."}, {"id": "48", "t": "Preferências e concurso de credores", "q": ["Art. 186: o crédito tributário prefere a todos, exceto o trabalhista.", "Na falência: trabalhista (até 150 salários mínimos), garantia real, depois o tributário (sem as multas).", "Execução fiscal não entra em concurso de credores (art. 187)."], "txt": "<b>Preferência<\/b> é a ordem em que os credores recebem quando o dinheiro não dá para todos.\n<b>Art. 186:<\/b> o crédito tributário <b>prefere a qualquer outro<\/b>, seja qual for a sua natureza ou o tempo em que foi constituído, <b>exceto<\/b> os créditos decorrentes da legislação do <b>trabalho<\/b> e do <b>acidente de trabalho<\/b>.\n<b>Na falência<\/b> (Lei 11.101/2005, art. 83), a ordem é:\n1º) créditos <b>trabalhistas<\/b> (até 150 salários mínimos por credor) e de acidente de trabalho;\n2º) créditos com <b>garantia real<\/b>, até o valor do bem;\n3º) créditos <b>tributários<\/b> (exceto as multas tributárias);\n4º) demais credores (privilégio especial, geral, quirografários); as multas tributárias ficam em penúltimo lugar.\nAntes disso são pagas as <b>despesas da massa falida<\/b> e as quantias a serem <b>restituídas<\/b> (créditos extraconcursais).\n<b>Art. 187:<\/b> a cobrança judicial do crédito tributário <b>não se sujeita a concurso de credores<\/b> nem à habilitação em falência, recuperação judicial, inventário ou arrolamento. A execução fiscal segue seu curso próprio.\n<b>Entre os entes:<\/b> o CTN previa preferência da União sobre Estados e Municípios. Em 2021 o STF declarou que essa regra <b>não foi recepcionada<\/b> pela Constituição e cancelou a Súmula 563 (ADPF 357)."}, {"id": "49", "t": "Fraude à execução fiscal e indisponibilidade de bens", "q": ["Art. 185: após a inscrição em dívida ativa, vender bem sem deixar patrimônio é fraude.", "Não precisa provar má-fé nem registro de penhora (STJ).", "Art. 185-A: indisponibilidade de bens se não houver bens para penhorar."], "txt": "<b>Fraude à execução fiscal (art. 185):<\/b> presume-se fraudulenta a venda ou oneração de bens por quem tem <b>crédito tributário inscrito em dívida ativa<\/b>, se o devedor não reservar <b>bens suficientes<\/b> para pagar a dívida. Antes da LC 118/2005, a regra valia só depois da citação; hoje vale desde a <b>inscrição<\/b>.\n<b>Consequência:<\/b> a venda é <b>ineficaz em relação ao Fisco<\/b>. O bem ainda pode ser penhorado, mesmo estando no nome do comprador.\n<b>Posição do STJ (recurso repetitivo):<\/b> a fraude fiscal é <b>presumida<\/b> (não precisa provar a má-fé do comprador), e a regra do <b>registro da penhora<\/b> (Súmula 375) <b>não se aplica<\/b> à fraude do art. 185. Basta a alienação posterior à inscrição.\nPara o <b>comprador<\/b>, o conselho é: peça certidões do vendedor antes de comprar bem relevante.\n<b>Indisponibilidade de bens (art. 185-A):<\/b> se o devedor <b>foi citado<\/b>, não pagou nem indicou bens, e <b>não foram achados bens penhoráveis<\/b>, o juiz decreta a <b>indisponibilidade<\/b> de bens e direitos, comunicando aos registros, bancos e órgãos. Fica limitada ao <b>valor da dívida<\/b>. O STJ exige antes o <b>esgotamento das diligências<\/b> para localizar bens.\nÉ medida <b>excepcional<\/b>, mas forte."}, {"id": "50", "t": "Certidões negativas e sanções políticas", "q": ["Certidão negativa (CND): prova que não há débitos (art. 205).", "Positiva com efeitos de negativa: débito suspenso, parcelado ou garantido (art. 206).", "Sanção política (interdição para forçar pagamento) é proibida."], "txt": "<b>Certidão negativa de débitos (CND):<\/b> documento do Fisco que diz que o contribuinte <b>não deve<\/b> tributos. É exigida para participar de licitações, vender imóvel, obter financiamentos. A lei fixa o prazo de <b>10 dias<\/b> para o Fisco emitir (art. 205, parágrafo único).\n<b>Certidão positiva com efeitos de negativa (CPEN, art. 206):<\/b> tem o <b>mesmo efeito<\/b> da negativa mesmo existindo débito, se o crédito estiver:\n• <b>não vencido<\/b>;\n• em <b>execução com penhora<\/b> efetivada; ou\n• com a <b>exigibilidade suspensa<\/b> (parcelamento, depósito, liminar).\n<b>Dispensa (art. 207):<\/b> quando a prova de quitação é exigida para evitar <b>perda de um direito<\/b> por prazo (caducidade), pode ser dispensada, mas os participantes respondem pelo tributo devido.\n<b>Responsabilidade (art. 208):<\/b> o servidor que emite certidão errada com dolo ou fraude responde <b>pessoalmente<\/b> pelo crédito.\n<b>Súmula 446 do STJ:<\/b> declarado e não pago o tributo pelo contribuinte, é legítima a <b>recusa<\/b> da certidão negativa.\n<b>Sanções políticas:<\/b> são meios indiretos para obrigar o pagamento, como interditar o estabelecimento ou apreender mercadorias. O STF as considera <b>inconstitucionais<\/b> (Súmulas 70, 323 e 547). O Fisco deve cobrar pela <b>execução fiscal<\/b>."}]}, {"tema": "5. Dívida ativa, CDA e execução fiscal", "itens": [{"id": "51", "t": "Dívida ativa: o que é e como nasce", "q": ["Crédito já vencido, inscrito num registro oficial.", "Tributária (art. 201 do CTN) ou não tributária (Lei 4.320/64).", "A inscrição controla a legalidade e dá origem à CDA."], "txt": "<b>Dívida ativa<\/b> é o crédito da Fazenda Pública (União, Estado, Município e suas autarquias) que <b>já venceu e não foi pago<\/b>, e que foi <b>registrado<\/b> oficialmente num cadastro próprio. Pense num “livro de devedores” que dá base à cobrança judicial.\n<b>Dois tipos:<\/b>\n<b>Tributária (art. 201 do CTN):<\/b> crédito de tributo (IPTU, ISS, ICMS) e suas multas, depois de esgotado o prazo para pagamento ou concluído o processo administrativo.\n<b>Não tributária:<\/b> o que não é tributo, como multas administrativas, aluguéis de bens públicos, foros e laudêmios, indenizações, taxa de ocupação, devoluções a que a lei obrigue.\nA Lei 6.830/80 (Lei de Execuções Fiscais, LEF) diz, no art. 2º, que qualquer valor cuja cobrança a lei atribua à Fazenda é dívida ativa.\n<b>Como nasce (inscrição):<\/b> o órgão competente (em regra, a Procuradoria) examina se a dívida está regular e a inscreve. A inscrição é o <b>controle administrativo de legalidade<\/b> do crédito. Dela sai o documento que vai instruir o processo: a <b>Certidão de Dívida Ativa (CDA)<\/b>.\n<b>Atenção:<\/b> os juros de mora não tiram a liquidez do crédito (art. 201, parágrafo único). E a inscrição na dívida ativa não-tributária <b>suspende a prescrição por 180 dias<\/b> (art. 2º, §3º da LEF); para o STJ, isso não vale para dívida tributária."}, {"id": "52", "t": "CDA: o que ela precisa ter", "q": ["CDA = Certidão de Dívida Ativa, o título que permite executar.", "Requisitos: art. 202 do CTN e art. 2º, §5º da LEF.", "Falta de requisito essencial gera nulidade (art. 203)."], "txt": "A <b>CDA<\/b> é o documento que prova a dívida e serve de <b>título executivo extrajudicial<\/b> (art. 784, IX do CPC). Sem ela, não há execução fiscal.\n<b>O que deve constar (art. 2º, §5º da LEF e art. 202 do CTN):<\/b>\n<b>1)<\/b> o <b>nome do devedor<\/b>, dos corresponsáveis e seu domicílio ou residência;\n<b>2)<\/b> o <b>valor original<\/b> da dívida, o termo inicial (a partir de quando se contam juros) e a <b>forma de calcular<\/b> juros, correção e outros encargos;\n<b>3)<\/b> a <b>origem<\/b>, a <b>natureza<\/b> e o <b>fundamento legal ou contratual<\/b> da dívida (de qual tributo se trata, qual a lei);\n<b>4)<\/b> a indicação de que os juros são calculados à <b>taxa legal ou contratual<\/b>;\n<b>5)<\/b> a <b>data e o número da inscrição<\/b> no registro de dívida ativa;\n<b>6)<\/b> o <b>número do processo administrativo<\/b> ou do auto de infração, se neles foi apurado o valor.\n<b>Regra prática:<\/b> o devedor precisa conseguir saber quem deve, quanto, por quê e com base em qual lei. Se isso falta, ele não consegue se defender (ampla defesa).\nA CDA deve ser <b>autenticada<\/b> pela autoridade e pode ser preparada de modo manual, mecânico ou eletrônico.\n<b>Não precisa<\/b> trazer planilha detalhada de cálculos (Súmula 559 do STJ)."}, {"id": "53", "t": "CDA: presunção, vícios e substituição", "q": ["Presunção de certeza e liquidez, mas relativa (art. 3º da LEF e art. 204 do CTN).", "Vício na CDA: nulidade, mas sanável até a sentença dos emba
